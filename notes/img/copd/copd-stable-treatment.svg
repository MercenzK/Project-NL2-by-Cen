<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 740" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="740" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">GOLD 2026: pharmacological treatment of stable COPD</text>
<rect x="80" y="48" width="600" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Confirmed COPD (post-bronchodilator FEV1/FVC &lt; 0.70)</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">Assess symptoms (mMRC or CAAT) and</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">moderate/severe exacerbations in the past year</text>
<polyline points="380,124 380,130.7 130,130.7 130,137.3" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="130,137.3 130,162" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,130.7 380,162" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,130.7 630,130.7 630,137.3" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="630,137.3 630,162" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="162" width="220" height="118" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="130.0" y="187.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Group A</text>
<text x="130.0" y="206.8" text-anchor="middle" font-size="15" fill="#1d2433">0 exacerbations</text>
<text x="130.0" y="226.2" text-anchor="middle" font-size="15" fill="#1d2433">mMRC 0–1, CAAT &lt; 10</text>
<text x="130.0" y="245.8" text-anchor="middle" font-size="15" fill="#1d2433">→ A bronchodilator</text>
<text x="130.0" y="265.2" text-anchor="middle" font-size="15" fill="#1d2433">(LABA preferred)</text>
<rect x="270" y="162" width="220" height="118" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="187.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Group B</text>
<text x="380.0" y="206.8" text-anchor="middle" font-size="15" fill="#1d2433">0 exacerbations</text>
<text x="380.0" y="226.2" text-anchor="middle" font-size="15" fill="#1d2433">mMRC ≥ 2, CAAT ≥ 10</text>
<text x="380.0" y="245.8" text-anchor="middle" font-size="15" fill="#1d2433">→ LABA + LAMA</text>
<text x="380.0" y="265.2" text-anchor="middle" font-size="15" fill="#1d2433">(single inhaler)</text>
<rect x="520" y="162" width="220" height="118" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="630.0" y="187.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Group E</text>
<text x="630.0" y="206.8" text-anchor="middle" font-size="15" fill="#1d2433">≥ 1 moderate or severe</text>
<text x="630.0" y="226.2" text-anchor="middle" font-size="15" fill="#1d2433">exacerbation</text>
<text x="630.0" y="245.8" text-anchor="middle" font-size="15" fill="#1d2433">→ LABA + LAMA</text>
<text x="630.0" y="265.2" text-anchor="middle" font-size="15" fill="#1d2433">+ ICS if eos ≥ 300</text>
<polyline points="130,280 130,293.3 630,293.3" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,280 380,293.3" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="630,280 630,293.3" fill="none" stroke="#444" stroke-width="2.2"/>
<circle cx="380" cy="300" r="4" fill="#444"/>
<polyline points="380,293.3 380,318" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="170" y="318" width="420" height="52" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="349.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Follow-up: ≥ 1 moderate/severe exacerbation?</text>
<polyline points="380,370 380,376.7 130,376.7 130,382.6" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="130,382.6 130,406" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,376.7 380,406" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,376.7 630,376.7 630,382.6" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="630,382.6 630,406" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="406" width="220" height="150" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="130.0" y="447.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">On LABA or LAMA</text>
<text x="130.0" y="466.8" text-anchor="middle" font-size="15" fill="#1d2433">eos &lt; 300:</text>
<text x="130.0" y="486.2" text-anchor="middle" font-size="15" fill="#1d2433">→ LABA + LAMA</text>
<text x="130.0" y="505.8" text-anchor="middle" font-size="15" fill="#1d2433">eos ≥ 300:</text>
<text x="130.0" y="525.2" text-anchor="middle" font-size="15" fill="#1d2433">→ LABA + LAMA + ICS</text>
<rect x="270" y="406" width="220" height="150" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="437.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">On LABA + LAMA</text>
<text x="380.0" y="457" text-anchor="middle" font-size="15" fill="#1d2433">eos ≥ 100:</text>
<text x="380.0" y="476.5" text-anchor="middle" font-size="15" fill="#1d2433">→ add ICS (triple)</text>
<text x="380.0" y="496" text-anchor="middle" font-size="15" fill="#1d2433">eos &lt; 100:</text>
<text x="380.0" y="515.5" text-anchor="middle" font-size="15" fill="#1d2433">→ roflumilast* or</text>
<text x="380.0" y="535" text-anchor="middle" font-size="15" fill="#1d2433">azithromycin**</text>
<rect x="520" y="406" width="220" height="150" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="630.0" y="437.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">On triple therapy</text>
<text x="630.0" y="457" text-anchor="middle" font-size="15" fill="#1d2433">→ roflumilast* or</text>
<text x="630.0" y="476.5" text-anchor="middle" font-size="15" fill="#1d2433">azithromycin**</text>
<text x="630.0" y="496" text-anchor="middle" font-size="15" fill="#1d2433">Biologic if eos ≥ 300 and</text>
<text x="630.0" y="515.5" text-anchor="middle" font-size="15" fill="#1d2433">2 moderate or 1 severe</text>
<text x="630.0" y="535" text-anchor="middle" font-size="15" fill="#1d2433">(dupilumab, mepolizumab)</text>
<rect x="20" y="576" width="720" height="110" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="607" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Persistent dyspnea (no exacerbation)</text>
<text x="380.0" y="626.5" text-anchor="middle" font-size="15" fill="#1d2433">LABA or LAMA → LABA + LAMA · check inhaler technique and adherence</text>
<text x="380.0" y="646" text-anchor="middle" font-size="15" fill="#1d2433">Pulmonary rehabilitation · consider ensifentrine · look for other causes</text>
<text x="380.0" y="665.5" text-anchor="middle" font-size="15" fill="#1d2433">For all: smoking cessation, vaccines, action plan, treat comorbidities</text>
<text x="380" y="722" text-anchor="middle" font-size="13" fill="#666">*FEV1 &lt; 50% + chronic bronchitis · **preferably former smokers · eos = blood eosinophils/µL · Adapted from GOLD 2026</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 736" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="736" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">COPD exacerbation: hospital management</text>
<rect x="80" y="48" width="600" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Suspected COPD exacerbation</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">↑ dyspnea ± cough/sputum worsening over ≤ 14 days</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">Exclude pneumonia, PE, heart failure, ACS, pneumothorax</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="156" width="600" height="130" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="187.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Drug treatment (moderate/severe)</text>
<text x="380.0" y="206.8" text-anchor="middle" font-size="15" fill="#1d2433">SABA ± SAMA (MDI + spacer or air-driven nebulizer)</text>
<text x="380.0" y="226.2" text-anchor="middle" font-size="15" fill="#1d2433">Prednisone 40 mg/day × 5 days</text>
<text x="380.0" y="245.8" text-anchor="middle" font-size="15" fill="#1d2433">Antibiotic × 5 days if purulent sputum (+ ↑ dyspnea or volume)</text>
<text x="380.0" y="265.2" text-anchor="middle" font-size="15" fill="#1d2433">or needs NIV/ventilation · no IV aminophylline</text>
<polyline points="380,286 380,318" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="170" y="318" width="420" height="52" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="349.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Acute respiratory failure? (check ABG)</text>
<polyline points="380,370 380,376.7 130,376.7 130,382.6" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="130,382.6 130,406" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,376.7 380,406" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,376.7 630,376.7 630,382.6" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="630,382.6 630,406" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="406" width="220" height="150" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="130.0" y="447.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Hypoxemic</text>
<text x="130.0" y="466.8" text-anchor="middle" font-size="15" fill="#1d2433">Controlled O2</text>
<text x="130.0" y="486.2" text-anchor="middle" font-size="15" fill="#1d2433">(Venturi mask)</text>
<text x="130.0" y="505.8" text-anchor="middle" font-size="15" fill="#1d2433">→ HFNT if still</text>
<text x="130.0" y="525.2" text-anchor="middle" font-size="15" fill="#1d2433">hypoxemic</text>
<rect x="270" y="406" width="220" height="150" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="447.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Hypercapnic</text>
<text x="380.0" y="466.8" text-anchor="middle" font-size="15" fill="#1d2433">pH ≤ 7.35 and</text>
<text x="380.0" y="486.2" text-anchor="middle" font-size="15" fill="#1d2433">PaCO2 ≥ 45 mmHg</text>
<text x="380.0" y="505.8" text-anchor="middle" font-size="15" fill="#1d2433">or muscle fatigue</text>
<text x="380.0" y="525.2" text-anchor="middle" font-size="15" fill="#1d2433">→ NIV (BiPAP)</text>
<rect x="520" y="406" width="220" height="150" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="630.0" y="447.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Intubate if</text>
<text x="630.0" y="466.8" text-anchor="middle" font-size="15" fill="#1d2433">NIV/HFNT fails</text>
<text x="630.0" y="486.2" text-anchor="middle" font-size="15" fill="#1d2433">or not tolerated</text>
<text x="630.0" y="505.8" text-anchor="middle" font-size="15" fill="#1d2433">↓ consciousness, arrest,</text>
<text x="630.0" y="525.2" text-anchor="middle" font-size="15" fill="#1d2433">aspiration, shock</text>
<rect x="20" y="576" width="720" height="110" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="607" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Before discharge</text>
<text x="380.0" y="626.5" text-anchor="middle" font-size="15" fill="#1d2433">LABA + LAMA (+ ICS if eosinophils raised) · check inhaler technique</text>
<text x="380.0" y="646" text-anchor="middle" font-size="15" fill="#1d2433">Pulmonary rehabilitation within 4 weeks · smoking cessation · vaccines</text>
<text x="380.0" y="665.5" text-anchor="middle" font-size="15" fill="#1d2433">Review at 1–4 weeks and 12–16 weeks (spirometry, need for LTOT)</text>
<text x="380" y="718" text-anchor="middle" font-size="13" fill="#666">Adapted from GOLD 2026 (Chapter 4, Figures 4.5–4.9)</text>
</svg>

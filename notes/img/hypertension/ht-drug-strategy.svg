<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="668" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Hypertension: drug treatment strategy</text>
<rect x="110" y="48" width="540" height="96" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Confirmed hypertension</text>
<text x="380.0" y="91.5" text-anchor="middle" font-size="15" fill="#1d2433">Office BP ≥ 140/90 (repeated) or HBPM ≥ 135/85</text>
<text x="380.0" y="111" text-anchor="middle" font-size="15" fill="#1d2433">or 24-h ABPM ≥ 130/80</text>
<text x="380.0" y="130.5" text-anchor="middle" font-size="15" fill="#1d2433">Lifestyle modification for everyone</text>
<polyline points="380,144 380,176" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="176" width="600" height="96" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 1 · Two-drug combination (single pill preferred)</text>
<text x="380.0" y="219.5" text-anchor="middle" font-size="15" fill="#1d2433">ACEI or ARB + CCB  or  ACEI or ARB + thiazide/thiazide-like</text>
<text x="380.0" y="239" text-anchor="middle" font-size="15" fill="#1d2433">Monotherapy if elderly/frail, low-risk grade 1 (140–149/90–95),</text>
<text x="380.0" y="258.5" text-anchor="middle" font-size="15" fill="#1d2433">or BP at risk with very high CV risk</text>
<polyline points="380,272 380,304" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="304" width="600" height="76" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="327.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 2 · Three-drug combination</text>
<text x="380.0" y="347.2" text-anchor="middle" font-size="15" fill="#1d2433">ACEI or ARB + CCB + thiazide-like diuretic</text>
<text x="380.0" y="366.8" text-anchor="middle" font-size="15" fill="#1d2433">(single pill preferred)</text>
<polyline points="380,380 380,412" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="412" width="600" height="76" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="435.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 3 · Resistant hypertension</text>
<text x="380.0" y="455.2" text-anchor="middle" font-size="15" fill="#1d2433">Uncontrolled on 3 drugs (max tolerated, incl. a diuretic)</text>
<text x="380.0" y="474.8" text-anchor="middle" font-size="15" fill="#1d2433">Confirm adherence and out-of-office BP · screen secondary causes</text>
<rect x="20" y="518" width="720" height="110" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="549" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Compelling situations</text>
<text x="380.0" y="568.5" text-anchor="middle" font-size="15" fill="#1d2433">CAD: ACEI and/or beta-blocker · angina: beta-blocker or CCB</text>
<text x="380.0" y="588" text-anchor="middle" font-size="15" fill="#1d2433">HFrEF: ACEI/ARB/ARNI + beta-blocker + MRA + SGLT2i; avoid non-DHP CCB</text>
<text x="380.0" y="607.5" text-anchor="middle" font-size="15" fill="#1d2433">Never combine ACEI with ARB</text>
<text x="380" y="650" text-anchor="middle" font-size="13" fill="#666">HBPM/ABPM = home/ambulatory BP monitoring · Adapted from 2024 Thai Guidelines on the Treatment of Hypertension</text>
</svg>

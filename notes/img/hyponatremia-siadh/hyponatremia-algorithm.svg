<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 770" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="770" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Hyponatremia and SIADH: approach</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Serum Na &lt; 135 mmol/L</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">Check glucose, lipids, protein · confirm hypotonic (serum osmolality &lt; 275 mOsm/kg)</text>
<polyline points="380,110 380,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="720" height="96" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="169.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Severe or moderately severe symptoms? → treat first, diagnose later</text>
<text x="380.0" y="186.2" text-anchor="middle" font-size="13" fill="#1d2433">Severe: vomiting, seizures, GCS ≤ 8, cardiorespiratory distress · Moderate: nausea, confusion, headache</text>
<text x="380.0" y="203.1" text-anchor="middle" font-size="13" fill="#1d2433">3% NaCl 150 mL IV over 20 min → recheck Na → repeat (up to 2 more) until Na rises by 5 mmol/L</text>
<text x="380.0" y="219.9" text-anchor="middle" font-size="13" fill="#1d2433">Limit rise ≤ 10 mmol/L in first 24 h and ≤ 8 mmol/L per 24 h after · overcorrection → D5W ± desmopressin</text>
<polyline points="380,238 380,270" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="270" width="720" height="46" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="297.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Urine osmolality and urine Na (spot sample, same time as serum)</text>
<polyline points="380,316 380,324 135,324" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,324 625,324" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,324 135,348" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,324 380,348" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="625,324 625,348" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="348" width="230" height="130" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="135.0" y="375.4" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Uosm ≤ 100 mOsm/kg</text>
<text x="135.0" y="392.2" text-anchor="middle" font-size="13" fill="#1d2433">(ADH suppressed)</text>
<text x="135.0" y="409.2" text-anchor="middle" font-size="13" fill="#1d2433">Primary polydipsia</text>
<text x="135.0" y="426.1" text-anchor="middle" font-size="13" fill="#1d2433">Low solute intake</text>
<text x="135.0" y="443.0" text-anchor="middle" font-size="13" fill="#1d2433">(beer potomania,</text>
<text x="135.0" y="459.9" text-anchor="middle" font-size="13" fill="#1d2433">tea and toast)</text>
<rect x="265" y="348" width="230" height="130" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="375.4" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Uosm &gt; 100, UNa ≤ 30</text>
<text x="380.0" y="392.2" text-anchor="middle" font-size="13" fill="#1d2433">(low effective volume)</text>
<text x="380.0" y="409.2" text-anchor="middle" font-size="13" fill="#1d2433">GI loss, third spacing</text>
<text x="380.0" y="426.1" text-anchor="middle" font-size="13" fill="#1d2433">Heart failure, cirrhosis</text>
<text x="380.0" y="443.0" text-anchor="middle" font-size="13" fill="#1d2433">Nephrotic syndrome</text>
<text x="380.0" y="459.9" text-anchor="middle" font-size="13" fill="#1d2433">→ treat volume / cause</text>
<rect x="510" y="348" width="230" height="130" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="625.0" y="375.4" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Uosm &gt; 100, UNa &gt; 30</text>
<text x="625.0" y="392.2" text-anchor="middle" font-size="13" fill="#1d2433">Diuretics, kidney disease</text>
<text x="625.0" y="409.2" text-anchor="middle" font-size="13" fill="#1d2433">Vomiting, adrenal</text>
<text x="625.0" y="426.1" text-anchor="middle" font-size="13" fill="#1d2433">insufficiency, salt wasting</text>
<text x="625.0" y="443.0" text-anchor="middle" font-size="13" fill="#1d2433">If euvolemic and no</text>
<text x="625.0" y="459.9" text-anchor="middle" font-size="13" fill="#1d2433">diuretic → think SIADH</text>
<polyline points="625,478 625,510" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="510" width="720" height="80" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="537.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">SIADH = euvolemic hypotonic hyponatremia + Uosm &gt; 100 + UNa &gt; 30</text>
<text x="380.0" y="554.6" text-anchor="middle" font-size="13" fill="#1d2433">Exclude hypothyroidism and adrenal insufficiency (TSH, morning cortisol) · no recent diuretic</text>
<text x="380.0" y="571.5" text-anchor="middle" font-size="13" fill="#1d2433">Causes: small cell lung cancer, CNS disease, pneumonia / PCP / TB, drugs (SSRI, carbamazepine), postoperative</text>
<polyline points="380,590 380,622" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="622" width="720" height="96" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="649.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Treat the cause + fluid restriction (first line)</text>
<text x="380.0" y="666.1" text-anchor="middle" font-size="13" fill="#1d2433">Restrict fluid &lt; 800–1000 mL/day · avoid 0.9% saline when Uosm is high (can worsen Na)</text>
<text x="380.0" y="683.0" text-anchor="middle" font-size="13" fill="#1d2433">Second line: oral urea, or loop diuretic + oral NaCl · SGLT2 inhibitor (emerging)</text>
<text x="380.0" y="700.0" text-anchor="middle" font-size="13" fill="#1d2433">Vaptan (tolvaptan): US option if restriction fails · not recommended by EU guideline</text>
<text x="380" y="742" text-anchor="middle" font-size="12" fill="#666">Uosm = urine osmolality · UNa = urine sodium (mmol/L) · D5W = 5% dextrose in water · GCS = Glasgow Coma Scale</text>
<text x="380" y="760" text-anchor="middle" font-size="12" fill="#666">Adapted from EU guideline (Spasovski 2014), Society for Endocrinology (2022) and StatPearls Hyponatremia / SIADH</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 830" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="830" fill="#ffffff"/>
<text x="380.0" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">STEMI reperfusion strategy</text>
<rect x="230" y="50" width="300" height="60" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="74.9" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433">Suspected ACS</text>
<text x="380.0" y="97.0" text-anchor="middle" font-size="17" fill="#1d2433">12-lead ECG within 10 min</text>
<line x1="380" y1="110" x2="380" y2="140" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="210" y="140" width="340" height="60" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="164.9" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433">ST elevation or</text>
<text x="380.0" y="187.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433">STEMI equivalent?</text>
<polyline points="210,170 120,170 120,230" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="165" y="160" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="20" y="230" width="200" height="90" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="120.0" y="259.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">NSTE-ACS</text>
<text x="120.0" y="280.6" text-anchor="middle" font-size="16" fill="#1d2433">hs-troponin 0/1 h</text>
<text x="120.0" y="301.4" text-anchor="middle" font-size="16" fill="#1d2433">+ risk stratification</text>
<line x1="380" y1="200" x2="380" y2="240" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="408" y="226" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="230" y="240" width="300" height="60" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="264.9" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433">Symptom onset</text>
<text x="380.0" y="287.0" text-anchor="middle" font-size="17" fill="#1d2433">≤ 12 h?</text>
<polyline points="530,270 640,270 640,320" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="590" y="260" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">&gt; 12 h</text>
<rect x="545" y="320" width="200" height="110" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="645.0" y="351.0" text-anchor="middle" font-size="15" fill="#1d2433">PCI if ongoing ischemia,</text>
<text x="645.0" y="370.5" text-anchor="middle" font-size="15" fill="#1d2433">HF, shock, arrhythmia;</text>
<text x="645.0" y="390.0" text-anchor="middle" font-size="15" fill="#1d2433">asymptomatic 12–48 h</text>
<text x="645.0" y="409.5" text-anchor="middle" font-size="15" fill="#1d2433">→ consider PCI</text>
<line x1="380" y1="300" x2="380" y2="340" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="408" y="326" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="215" y="340" width="330" height="70" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="369.9" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433">STEMI Dx → wire crossing</text>
<text x="380.0" y="392.0" text-anchor="middle" font-size="17" fill="#1d2433">≤ 120 min?</text>
<polyline points="215,375 120,375 120,450" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="165" y="365" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="20" y="450" width="200" height="80" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="120.0" y="473.8" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433">Primary PCI</text>
<text x="120.0" y="495.9" text-anchor="middle" font-size="17" fill="#1d2433">FMC → wire</text>
<text x="120.0" y="518.0" text-anchor="middle" font-size="17" fill="#1d2433">≤ 90 min</text>
<line x1="380" y1="410" x2="380" y2="450" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="404" y="436" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="230" y="450" width="300" height="80" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="474.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Immediate fibrinolysis</text>
<text x="380.0" y="495.6" text-anchor="middle" font-size="16" fill="#1d2433">≤ 10 min after Dx (max 30)</text>
<text x="380.0" y="516.4" text-anchor="middle" font-size="16" fill="#1d2433">Contraindicated → transfer PCI</text>
<line x1="380" y1="530" x2="380" y2="570" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="195" y="570" width="370" height="80" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="593.9" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433">Reassess at 60–90 min:</text>
<text x="380.0" y="616.0" text-anchor="middle" font-size="17" fill="#1d2433">ST resolution ≥ 50%</text>
<text x="380.0" y="638.1" text-anchor="middle" font-size="17" fill="#1d2433">+ chest pain relief?</text>
<polyline points="195,610 120,610 120,690" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="160" y="600" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="20" y="690" width="200" height="70" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="120.0" y="719.9" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433">Rescue PCI</text>
<text x="120.0" y="742.0" text-anchor="middle" font-size="17" fill="#1d2433">immediately</text>
<polyline points="565,610 640,610 640,690" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="605" y="600" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="505" y="690" width="240" height="90" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="625.0" y="719.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Angiography ± PCI</text>
<text x="625.0" y="740.6" text-anchor="middle" font-size="16" fill="#1d2433">Thai: 24–72 h</text>
<text x="625.0" y="761.4" text-anchor="middle" font-size="16" fill="#1d2433">ESC: 2–24 h</text>
<text x="380.0" y="812" text-anchor="middle" font-size="13" fill="#666">Dx = STEMI diagnosis (ECG) · FMC = first medical contact · Adapted from Thai ACS Guidelines 2020 (Fig. 1) and 2023 ESC ACS Guidelines</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ECG leads and culprit coronary artery</text>
  <!-- grid 4 columns x 3 rows -->
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <!-- row 1 -->
    <rect x="40"  y="55" width="150" height="70" rx="8" fill="#d6ecff" stroke="#1f6fb2" stroke-width="2"/><text x="115" y="97" fill="#1f4e79">I</text>
    <rect x="200" y="55" width="150" height="70" rx="8" fill="#eeeeee" stroke="#999" stroke-width="2"/><text x="275" y="97" fill="#555">aVR</text>
    <rect x="360" y="55" width="150" height="70" rx="8" fill="#ffe0cc" stroke="#d2691e" stroke-width="2"/><text x="435" y="97" fill="#8b3a0e">V1</text>
    <rect x="520" y="55" width="150" height="70" rx="8" fill="#ffe0cc" stroke="#d2691e" stroke-width="2"/><text x="595" y="97" fill="#8b3a0e">V4</text>
    <!-- row 2 -->
    <rect x="40"  y="135" width="150" height="70" rx="8" fill="#e3f5d8" stroke="#3c8d2f" stroke-width="2"/><text x="115" y="177" fill="#2b6321">II</text>
    <rect x="200" y="135" width="150" height="70" rx="8" fill="#d6ecff" stroke="#1f6fb2" stroke-width="2"/><text x="275" y="177" fill="#1f4e79">aVL</text>
    <rect x="360" y="135" width="150" height="70" rx="8" fill="#ffe0cc" stroke="#d2691e" stroke-width="2"/><text x="435" y="177" fill="#8b3a0e">V2</text>
    <rect x="520" y="135" width="150" height="70" rx="8" fill="#d6ecff" stroke="#1f6fb2" stroke-width="2"/><text x="595" y="177" fill="#1f4e79">V5</text>
    <!-- row 3 -->
    <rect x="40"  y="215" width="150" height="70" rx="8" fill="#e3f5d8" stroke="#3c8d2f" stroke-width="2"/><text x="115" y="257" fill="#2b6321">III</text>
    <rect x="200" y="215" width="150" height="70" rx="8" fill="#e3f5d8" stroke="#3c8d2f" stroke-width="2"/><text x="275" y="257" fill="#2b6321">aVF</text>
    <rect x="360" y="215" width="150" height="70" rx="8" fill="#ffe0cc" stroke="#d2691e" stroke-width="2"/><text x="435" y="257" fill="#8b3a0e">V3</text>
    <rect x="520" y="215" width="150" height="70" rx="8" fill="#d6ecff" stroke="#1f6fb2" stroke-width="2"/><text x="595" y="257" fill="#1f4e79">V6</text>
  </g>
  <!-- legend -->
  <g font-size="14" fill="#222">
    <rect x="40" y="305" width="18" height="18" fill="#ffe0cc" stroke="#d2691e"/>
    <text x="66" y="319">Anterior / septal (V1–V4) → LAD</text>
    <rect x="380" y="305" width="18" height="18" fill="#d6ecff" stroke="#1f6fb2"/>
    <text x="406" y="319">Lateral (I, aVL, V5–V6) → LCx / diagonal</text>
    <rect x="40" y="335" width="18" height="18" fill="#e3f5d8" stroke="#3c8d2f"/>
    <text x="66" y="349">Inferior (II, III, aVF) → RCA (~80%) or LCx</text>
    <rect x="380" y="335" width="18" height="18" fill="#eeeeee" stroke="#999"/>
    <text x="406" y="349">aVR ST↑ + diffuse ST↓ → LM / 3VD</text>
    <text x="40" y="382" font-size="13" fill="#444">RV infarct: ST↑ in V4R · Posterior MI: ST↓ + tall R in V1–V3 → confirm with ST↑ in V7–V9</text>
  </g>
</svg>

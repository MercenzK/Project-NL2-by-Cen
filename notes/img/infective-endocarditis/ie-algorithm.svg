<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 912" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="912" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Suspected infective endocarditis: approach</text>
<rect x="110" y="48" width="540" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Suspected infective endocarditis</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">Fever + predisposition, new murmur or embolic events</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">or bacteremia with a typical IE organism</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="110" y="156" width="540" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="179.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Multiple blood culture sets before antibiotics</text>
<text x="380.0" y="199.2" text-anchor="middle" font-size="15" fill="#1d2433">Separate venepunctures (aerobic + anaerobic bottles)</text>
<text x="380.0" y="218.8" text-anchor="middle" font-size="15" fill="#1d2433">Acutely ill: start empirical IV antibiotics after cultures</text>
<polyline points="380,232 380,264" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="110" y="264" width="540" height="56" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="297.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">TTE first · TOE in most patients (even if TTE positive)</text>
<polyline points="380,320 380,352" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="230" y="352" width="300" height="52" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="383.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Duke-ISCVID 2023 criteria</text>
<polyline points="230,378 130,378 130,415.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,404 380,415.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="530,378 630,378 630,415.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="130,415.2 130,436" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,415.2 380,436" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="630,415.2 630,436" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="436" width="220" height="130" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="130.0" y="477" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Definite IE</text>
<text x="130.0" y="496.5" text-anchor="middle" font-size="15" fill="#1d2433">2 major</text>
<text x="130.0" y="516" text-anchor="middle" font-size="15" fill="#1d2433">or 1 major + 3 minor</text>
<text x="130.0" y="535.5" text-anchor="middle" font-size="15" fill="#1d2433">or 5 minor</text>
<rect x="270" y="436" width="220" height="130" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="467.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Possible IE</text>
<text x="380.0" y="486.8" text-anchor="middle" font-size="15" fill="#1d2433">1 major + 1 minor</text>
<text x="380.0" y="506.2" text-anchor="middle" font-size="15" fill="#1d2433">or 3 minor</text>
<text x="380.0" y="525.8" text-anchor="middle" font-size="15" fill="#1d2433">→ repeat cultures, TOE,</text>
<text x="380.0" y="545.2" text-anchor="middle" font-size="15" fill="#1d2433">cardiac CT / PET-CT</text>
<rect x="520" y="436" width="220" height="130" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="630.0" y="477" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Rejected IE</text>
<text x="630.0" y="496.5" text-anchor="middle" font-size="15" fill="#1d2433">Firm alternative</text>
<text x="630.0" y="516" text-anchor="middle" font-size="15" fill="#1d2433">diagnosis, or does not</text>
<text x="630.0" y="535.5" text-anchor="middle" font-size="15" fill="#1d2433">meet possible criteria</text>
<polyline points="130,566 130,584.2 380,584.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,566 380,584.2" fill="none" stroke="#444" stroke-width="2.2"/>
<circle cx="255" cy="596" r="4" fill="#444"/>
<polyline points="255,584.2 255,618" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="618" width="470" height="110" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="255.0" y="649" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Targeted IV antibiotics by organism</text>
<text x="255.0" y="668.5" text-anchor="middle" font-size="15" fill="#1d2433">Endocarditis Team (cardiology, ID, surgery)</text>
<text x="255.0" y="688" text-anchor="middle" font-size="15" fill="#1d2433">Look for complications: abscess, emboli,</text>
<text x="255.0" y="707.5" text-anchor="middle" font-size="15" fill="#1d2433">heart failure, mycotic aneurysm</text>
<polyline points="255,728 255,760" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="760" width="720" height="110" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="791" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Consider cardiac surgery</text>
<text x="380.0" y="810.5" text-anchor="middle" font-size="15" fill="#1d2433">Heart failure from severe valve dysfunction</text>
<text x="380.0" y="830" text-anchor="middle" font-size="15" fill="#1d2433">Uncontrolled infection: abscess, fungi/MDR, positive cultures &gt; 7 days on therapy</text>
<text x="380.0" y="849.5" text-anchor="middle" font-size="15" fill="#1d2433">Embolic risk: vegetation ≥ 10 mm with another surgical indication</text>
<text x="380" y="894" text-anchor="middle" font-size="13" fill="#666">TTE/TOE = transthoracic/transoesophageal echo · Adapted from 2023 ESC IE guidelines and 2023 Duke-ISCVID criteria</text>
</svg>

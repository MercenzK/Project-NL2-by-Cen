<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 930" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="930" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Acute pericarditis: triage and treatment</text>
<rect x="170" y="48" width="420" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="74.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Suspected acute pericarditis</text>
<text x="380.0" y="95.0" text-anchor="middle" font-size="16" fill="#1d2433">Pleuritic chest pain, better sitting forward</text>
<polyline points="380,110 380,134" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="130" y="134" width="500" height="84" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="161.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Confirm: typical chest pain + ≥ 1 of</text>
<text x="380.0" y="181.2" text-anchor="middle" font-size="15" fill="#1d2433">pericardial rub · ECG changes · ↑ CRP ·</text>
<text x="380.0" y="200.8" text-anchor="middle" font-size="15" fill="#1d2433">pericardial effusion · CMR pericardial LGE/edema</text>
<polyline points="380,218 380,244" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="250" y="244" width="260" height="56" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="277.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Cardiac tamponade?</text>
<polyline points="510,272 568,272" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="539" y="264" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="570" y="236" width="170" height="72" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="655.0" y="267.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Urgent</text>
<text x="655.0" y="287.0" text-anchor="middle" font-size="15" fill="#1d2433">pericardiocentesis</text>
<polyline points="380,300 380,326" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="402" y="318" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="160" y="326" width="440" height="100" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="344.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">High-risk features?</text>
<text x="380.0" y="362.7" text-anchor="middle" font-size="14" fill="#1d2433">Major: fever &gt; 38 °C, subacute onset,</text>
<text x="380.0" y="380.9" text-anchor="middle" font-size="14" fill="#1d2433">large effusion (&gt; 20 mm), no response to</text>
<text x="380.0" y="399.1" text-anchor="middle" font-size="14" fill="#1d2433">NSAID in 7 days · Minor: myopericarditis,</text>
<text x="380.0" y="417.3" text-anchor="middle" font-size="14" fill="#1d2433">immunosuppression, trauma, anticoagulant</text>
<polyline points="600,376 640,376 640,450" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="620" y="368" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="540" y="450" width="200" height="76" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="640.0" y="474.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Admit</text>
<text x="640.0" y="492.9" text-anchor="middle" font-size="14" fill="#1d2433">Search etiology</text>
<text x="640.0" y="511.1" text-anchor="middle" font-size="14" fill="#1d2433">(TB, cancer, AI, bacterial)</text>
<polyline points="160,376 110,376 110,450" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="135" y="368" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="20" y="450" width="190" height="76" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="115.0" y="473.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Outpatient</text>
<text x="115.0" y="493.2" text-anchor="middle" font-size="15" fill="#1d2433">Review after</text>
<text x="115.0" y="512.8" text-anchor="middle" font-size="15" fill="#1d2433">1 week</text>
<polyline points="110,526 110,580 380,580" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="640,526 640,580 380,580" fill="none" stroke="#444" stroke-width="2.2"/>
<circle cx="380" cy="580" r="4" fill="#444"/>
<polyline points="380,580 380,610" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="220" y="610" width="320" height="84" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="637.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Aspirin or NSAID + colchicine</text>
<text x="380.0" y="657.2" text-anchor="middle" font-size="15" fill="#1d2433">Colchicine ≥ 3 months</text>
<text x="380.0" y="676.8" text-anchor="middle" font-size="15" fill="#1d2433">Restrict exercise</text>
<polyline points="380,694 380,724" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="210" y="724" width="340" height="56" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="757.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Poor response / recurrence?</text>
<polyline points="380,780 380,810" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="402" y="802" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="160" y="810" width="440" height="76" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="833.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Low–moderate dose corticosteroid + colchicine</text>
<text x="380.0" y="853.2" text-anchor="middle" font-size="15" fill="#1d2433">Refractory with ↑ CRP → IL-1 inhibitor</text>
<text x="380.0" y="872.8" text-anchor="middle" font-size="15" fill="#1d2433">(anakinra, rilonacept)</text>
<text x="380" y="910" text-anchor="middle" font-size="13" fill="#666">AI = autoimmune · LGE = late gadolinium enhancement · Adapted from ESC 2015 &amp; 2025</text>
</svg>

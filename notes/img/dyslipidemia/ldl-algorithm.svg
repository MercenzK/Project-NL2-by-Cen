<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1076" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="1076" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">LDL-C lowering strategy (Thai RCPT 2024)</text>
<rect x="30" y="48" width="330" height="84" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="195.0" y="74.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Adult with dyslipidemia</text>
<text x="195.0" y="95.6" text-anchor="middle" font-size="16" fill="#1d2433">Exclude secondary causes</text>
<text x="195.0" y="116.4" text-anchor="middle" font-size="16" fill="#1d2433">Look for FH signs</text>
<line x1="195" y1="132" x2="195" y2="172" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="30" y="174" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="215.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Clinical ASCVD?</text>
<text x="195.0" y="236" text-anchor="middle" font-size="16" fill="#1d2433">(ACS, CCS, ischemic stroke/TIA, PAD)</text>
<line x1="360" y1="220" x2="420" y2="220" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="212" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="164" width="315" height="112" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="577.5" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Secondary prevention</text>
<text x="577.5" y="215.5" text-anchor="middle" font-size="15" fill="#1d2433">High-intensity statin</text>
<text x="577.5" y="235" text-anchor="middle" font-size="15" fill="#1d2433">ACS: LDL-C &lt; 55 &amp; ≥ 50% ↓</text>
<text x="577.5" y="254.5" text-anchor="middle" font-size="15" fill="#1d2433">CCS/stroke: &lt; 70 &amp; ≥ 50% ↓</text>
<line x1="195.0" y1="266" x2="195.0" y2="316" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="298" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="316" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="357.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">LDL-C &gt; 190 mg/dL</text>
<text x="195.0" y="378" text-anchor="middle" font-size="16" fill="#1d2433">or suspected FH?</text>
<line x1="360" y1="362" x2="420" y2="362" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="354" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="306" width="315" height="112" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="577.5" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Statin</text>
<text x="577.5" y="357.5" text-anchor="middle" font-size="15" fill="#1d2433">FH: high-intensity, &lt; 70 &amp; ≥ 50% ↓</text>
<text x="577.5" y="377" text-anchor="middle" font-size="15" fill="#1d2433">LDL &gt; 190: moderate → high,</text>
<text x="577.5" y="396.5" text-anchor="middle" font-size="15" fill="#1d2433">&lt; 100 &amp; ≥ 50% ↓</text>
<line x1="195.0" y1="408" x2="195.0" y2="458" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="440" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="458" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="499.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Diabetes (age &gt; 40)</text>
<text x="195.0" y="520" text-anchor="middle" font-size="16" fill="#1d2433">or CKD (age ≥ 50, eGFR &lt; 60)?</text>
<line x1="360" y1="504" x2="420" y2="504" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="496" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="448" width="315" height="112" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="577.5" y="480" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Statin</text>
<text x="577.5" y="499.5" text-anchor="middle" font-size="15" fill="#1d2433">DM ≥ 2 risk factors: &lt; 70 &amp; ≥ 50% ↓</text>
<text x="577.5" y="519" text-anchor="middle" font-size="15" fill="#1d2433">DM 0–1 RF / CKD: &lt; 100 &amp; ≥ 30% ↓</text>
<text x="577.5" y="538.5" text-anchor="middle" font-size="15" fill="#1d2433">Dialysis: do not start statin</text>
<line x1="195.0" y1="550" x2="195.0" y2="600" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="582" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="600" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="641.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Thai CV Risk Score</text>
<text x="195.0" y="662" text-anchor="middle" font-size="16" fill="#1d2433">10-year risk ≥ 10%?</text>
<line x1="360" y1="646" x2="420" y2="646" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="638" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="600" width="315" height="92" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="577.5" y="631.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Low–moderate statin</text>
<text x="577.5" y="651.2" text-anchor="middle" font-size="15" fill="#1d2433">Target LDL-C &lt; 100</text>
<text x="577.5" y="670.8" text-anchor="middle" font-size="15" fill="#1d2433">&amp; ≥ 30% ↓</text>
<line x1="195.0" y1="692" x2="195.0" y2="732" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="724" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="732" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="763.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Risk enhancer?</text>
<text x="195.0" y="783.2" text-anchor="middle" font-size="15" fill="#1d2433">CAC &gt; 100, ABI &lt; 0.9, FHx premature</text>
<text x="195.0" y="802.8" text-anchor="middle" font-size="15" fill="#1d2433">ASCVD, chronic inflammation</text>
<line x1="360" y1="778" x2="420" y2="778" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="770" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="738" width="315" height="80" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="577.5" y="773.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Consider statin (IIb)</text>
<text x="577.5" y="793" text-anchor="middle" font-size="15" fill="#1d2433">LDL-C &lt; 100 &amp; ≥ 30% ↓</text>
<line x1="195.0" y1="824" x2="195.0" y2="860" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="850" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="860" width="330" height="60" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="195.0" y="885.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Lifestyle modification</text>
<text x="195.0" y="906" text-anchor="middle" font-size="16" fill="#1d2433">Reassess lipids and risk</text>
<rect x="80" y="950" width="600" height="86" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="977.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Not at target on maximally tolerated statin (4–12 wk)?</text>
<text x="380.0" y="998.6" text-anchor="middle" font-size="16" fill="#1d2433">→ check adherence → add ezetimibe</text>
<text x="380.0" y="1019.4" text-anchor="middle" font-size="16" fill="#1d2433">→ still not at target → refer for PCSK9 inhibitor</text>
<text x="380" y="1062" text-anchor="middle" font-size="13" fill="#666">↓ = reduction from baseline LDL-C · RF = ASCVD risk factor · Adapted from RCPT Thai Dyslipidemia CPG 2024 (Figures 1–5)</text>
</svg>

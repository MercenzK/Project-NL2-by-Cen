<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1062" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="1062" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">LDL-C lowering strategy (Thai RCPT 2024)</text>
<rect x="30" y="48" width="330" height="84" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="195.0" y="74.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Adult with dyslipidemia</text>
<text x="195.0" y="95.6" text-anchor="middle" font-size="16" fill="#1d2433">Exclude secondary causes</text>
<text x="195.0" y="116.4" text-anchor="middle" font-size="16" fill="#1d2433">Look for FH signs</text>
<line x1="195" y1="132" x2="195" y2="158" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="30" y="160" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="201.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Clinical ASCVD?</text>
<text x="195.0" y="222.0" text-anchor="middle" font-size="16" fill="#1d2433">(ACS, CCS, ischemic stroke/TIA, PAD)</text>
<line x1="360" y1="206.0" x2="420" y2="206.0" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="198.0" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="150.0" width="315" height="112" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="577.5" y="182.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Secondary prevention</text>
<text x="577.5" y="201.5" text-anchor="middle" font-size="15" fill="#1d2433">High-intensity statin</text>
<text x="577.5" y="221.0" text-anchor="middle" font-size="15" fill="#1d2433">ACS: LDL-C &lt; 55 &amp; ≥ 50% ↓</text>
<text x="577.5" y="240.5" text-anchor="middle" font-size="15" fill="#1d2433">CCS/stroke: &lt; 70 &amp; ≥ 50% ↓</text>
<line x1="195.0" y1="252" x2="195.0" y2="302" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="284" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="302" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="343.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">LDL-C &gt; 190 mg/dL</text>
<text x="195.0" y="364.0" text-anchor="middle" font-size="16" fill="#1d2433">or suspected FH?</text>
<line x1="360" y1="348.0" x2="420" y2="348.0" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="340.0" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="292.0" width="315" height="112" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="577.5" y="324.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Statin</text>
<text x="577.5" y="343.5" text-anchor="middle" font-size="15" fill="#1d2433">FH: high-intensity, &lt; 70 &amp; ≥ 50% ↓</text>
<text x="577.5" y="363.0" text-anchor="middle" font-size="15" fill="#1d2433">LDL &gt; 190: moderate → high,</text>
<text x="577.5" y="382.5" text-anchor="middle" font-size="15" fill="#1d2433">&lt; 100 &amp; ≥ 50% ↓</text>
<line x1="195.0" y1="394" x2="195.0" y2="444" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="426" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="444" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="485.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Diabetes (age &gt; 40)</text>
<text x="195.0" y="506.0" text-anchor="middle" font-size="16" fill="#1d2433">or CKD (age ≥ 50, eGFR &lt; 60)?</text>
<line x1="360" y1="490.0" x2="420" y2="490.0" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="482.0" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="434.0" width="315" height="112" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="577.5" y="466.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Statin</text>
<text x="577.5" y="485.5" text-anchor="middle" font-size="15" fill="#1d2433">DM ≥ 2 risk factors: &lt; 70 &amp; ≥ 50% ↓</text>
<text x="577.5" y="505.0" text-anchor="middle" font-size="15" fill="#1d2433">DM 0–1 RF / CKD: &lt; 100 &amp; ≥ 30% ↓</text>
<text x="577.5" y="524.5" text-anchor="middle" font-size="15" fill="#1d2433">Dialysis: do not start statin</text>
<line x1="195.0" y1="536" x2="195.0" y2="586" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="568" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="586" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="627.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Thai CV Risk Score</text>
<text x="195.0" y="648.0" text-anchor="middle" font-size="16" fill="#1d2433">10-year risk ≥ 10%?</text>
<line x1="360" y1="632.0" x2="420" y2="632.0" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="624.0" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="586.0" width="315" height="92" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="577.5" y="617.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Low–moderate statin</text>
<text x="577.5" y="637.2" text-anchor="middle" font-size="15" fill="#1d2433">Target LDL-C &lt; 100</text>
<text x="577.5" y="656.8" text-anchor="middle" font-size="15" fill="#1d2433">&amp; ≥ 30% ↓</text>
<line x1="195.0" y1="678" x2="195.0" y2="718" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="710" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="718" width="330" height="92" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="749.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Risk enhancer?</text>
<text x="195.0" y="769.2" text-anchor="middle" font-size="15" fill="#1d2433">CAC &gt; 100, ABI &lt; 0.9, FHx premature</text>
<text x="195.0" y="788.8" text-anchor="middle" font-size="15" fill="#1d2433">ASCVD, chronic inflammation</text>
<line x1="360" y1="764.0" x2="420" y2="764.0" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="390.0" y="756.0" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="420" y="724.0" width="315" height="80" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="577.5" y="759.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Consider statin (IIb)</text>
<text x="577.5" y="779.0" text-anchor="middle" font-size="15" fill="#1d2433">LDL-C &lt; 100 &amp; ≥ 30% ↓</text>
<line x1="195.0" y1="810" x2="195.0" y2="846" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="217.0" y="836" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="30" y="846" width="330" height="60" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="195.0" y="871.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Lifestyle modification</text>
<text x="195.0" y="892.0" text-anchor="middle" font-size="16" fill="#1d2433">Reassess lipids and risk</text>
<rect x="80" y="936" width="600" height="86" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="963.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Not at target on maximally tolerated statin (4–12 wk)?</text>
<text x="380.0" y="984.6" text-anchor="middle" font-size="16" fill="#1d2433">→ check adherence → add ezetimibe</text>
<text x="380.0" y="1005.4" text-anchor="middle" font-size="16" fill="#1d2433">→ still not at target → refer for PCSK9 inhibitor</text>
<text x="380" y="1048" text-anchor="middle" font-size="13" fill="#666">↓ = reduction from baseline LDL-C · RF = ASCVD risk factor · Adapted from RCPT Thai Dyslipidemia CPG 2024 (Figures 1–5)</text>
</svg>

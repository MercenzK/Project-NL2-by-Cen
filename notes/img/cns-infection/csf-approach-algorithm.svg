<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 588" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="588" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">CNS infection: antibiotics first, then read the CSF</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Suspected meningitis / encephalitis</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">Fever, headache, neck stiffness, altered consciousness · take blood cultures</text>
<polyline points="380,110 380,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="720" height="80" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="169.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Focal deficit, new seizure, abnormal pupils, GCS ≤ 9, space-occupying risk?</text>
<text x="380.0" y="186.6" text-anchor="middle" font-size="13" fill="#1d2433">Yes → give antibiotics (± dexamethasone, ± acyclovir) FIRST, then CT, LP only if safe</text>
<text x="380.0" y="203.5" text-anchor="middle" font-size="13" fill="#1d2433">No → lumbar puncture now (opening pressure, cells, glucose ratio, protein, stains)</text>
<polyline points="380,222 380,230" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="105,230 655,230" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="105,230 105,254" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="288,230 288,254" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="472,230 472,254" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="655,230 655,254" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="254" width="170" height="146" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="105.0" y="289.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Bacterial</text>
<text x="105.0" y="306.2" text-anchor="middle" font-size="12" fill="#1d2433">PMN ↑↑, glucose ratio</text>
<text x="105.0" y="323.2" text-anchor="middle" font-size="12" fill="#1d2433">&lt; 0.4, protein ↑↑</text>
<text x="105.0" y="340.1" text-anchor="middle" font-size="12" fill="#1d2433">Ceftriaxone</text>
<text x="105.0" y="357.0" text-anchor="middle" font-size="12" fill="#1d2433">(+ ampicillin: Listeria)</text>
<text x="105.0" y="373.9" text-anchor="middle" font-size="12" fill="#1d2433">Pig → S. suis, deafness</text>
<rect x="203" y="254" width="170" height="146" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="288.0" y="289.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Viral / HSV</text>
<text x="288.0" y="306.2" text-anchor="middle" font-size="12" fill="#1d2433">Lymphocytes</text>
<text x="288.0" y="323.2" text-anchor="middle" font-size="12" fill="#1d2433">Glucose normal</text>
<text x="288.0" y="340.1" text-anchor="middle" font-size="12" fill="#1d2433">RBC ↑, temporal lobe</text>
<text x="288.0" y="357.0" text-anchor="middle" font-size="12" fill="#1d2433">→ IV acyclovir now</text>
<text x="288.0" y="373.9" text-anchor="middle" font-size="12" fill="#1d2433">(HSV PCR)</text>
<rect x="386" y="254" width="170" height="146" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="471.0" y="289.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">TB / fungal</text>
<text x="471.0" y="306.2" text-anchor="middle" font-size="12" fill="#1d2433">Lymphocytes, glucose ↓</text>
<text x="471.0" y="323.2" text-anchor="middle" font-size="12" fill="#1d2433">protein ↑↑, OP ↑</text>
<text x="471.0" y="340.1" text-anchor="middle" font-size="12" fill="#1d2433">TB: basal enhancement</text>
<text x="471.0" y="357.0" text-anchor="middle" font-size="12" fill="#1d2433">Crypto: HIV, India ink,</text>
<text x="471.0" y="373.9" text-anchor="middle" font-size="12" fill="#1d2433">CrAg · drain high OP</text>
<rect x="570" y="254" width="170" height="146" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="655.0" y="289.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Eosinophilic</text>
<text x="655.0" y="306.2" text-anchor="middle" font-size="12" fill="#1d2433">Eosinophils &gt; 10%</text>
<text x="655.0" y="323.2" text-anchor="middle" font-size="12" fill="#1d2433">Raw snail / prawn</text>
<text x="655.0" y="340.1" text-anchor="middle" font-size="12" fill="#1d2433">→ Angiostrongylus</text>
<text x="655.0" y="357.0" text-anchor="middle" font-size="12" fill="#1d2433">Prednisolone,</text>
<text x="655.0" y="373.9" text-anchor="middle" font-size="12" fill="#1d2433">repeat LP for pain</text>
<polyline points="105,400 105,410" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="288,400 288,410" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="472,400 472,410" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="655,400 655,410" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="105,410 655,410" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,410 380,436" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="436" width="720" height="100" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="465.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Specific treatment and prevention</text>
<text x="380.0" y="482.1" text-anchor="middle" font-size="13" fill="#1d2433">TB meningitis: HRZE 2 months then HR + dexamethasone · Cryptococcus: AmB + flucytosine + fluconazole</text>
<text x="380.0" y="499.1" text-anchor="middle" font-size="13" fill="#1d2433">Meningococcus: droplet isolation 24 h after antibiotics · contacts: rifampicin, ciprofloxacin or ceftriaxone</text>
<text x="380.0" y="516.0" text-anchor="middle" font-size="13" fill="#1d2433">Dexamethasone continues only for pneumococcus / Hib · hearing test after bacterial meningitis</text>
<text x="380" y="560" text-anchor="middle" font-size="12" fill="#666">OP = opening pressure · CrAg = cryptococcal antigen · HRZE = isoniazid, rifampicin, pyrazinamide, ethambutol</text>
<text x="380" y="578" text-anchor="middle" font-size="12" fill="#666">Adapted from NICE NG240 (2024) and StatPearls (bacterial meningitis, HSV encephalitis, TBM, cryptococcal meningitis)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 791" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="791" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Suspected myocarditis: approach</text>
<rect x="110" y="48" width="540" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Suspected myocarditis (IMPS)</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">Chest pain, dyspnoea, palpitations, often after viral prodrome</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">Troponin ↑ · admit all patients with myocarditis</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="110" y="156" width="540" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="179.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Initial work-up</text>
<text x="380.0" y="199.2" text-anchor="middle" font-size="15" fill="#1d2433">ECG, troponin, CRP, BNP/NT-proBNP, echocardiography</text>
<text x="380.0" y="218.8" text-anchor="middle" font-size="15" fill="#1d2433">Rule out ACS: CT or invasive angiography if CAD likely</text>
<polyline points="380,232 380,264" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="110" y="264" width="540" height="56" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="297.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">CMR (Lake Louise): T1-based + T2-based abnormality</text>
<polyline points="380,320 380,352" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="230" y="352" width="300" height="52" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="383.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Severity?</text>
<polyline points="230,378 130,378 130,415.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,404 380,415.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="530,378 630,378 630,415.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="130,415.2 130,436" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,415.2 380,436" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="630,415.2 630,436" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="436" width="220" height="150" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="130.0" y="467.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Uncomplicated</text>
<text x="130.0" y="487" text-anchor="middle" font-size="15" fill="#1d2433">LVEF ≥ 50%, no HF,</text>
<text x="130.0" y="506.5" text-anchor="middle" font-size="15" fill="#1d2433">no VA, no AV block</text>
<text x="130.0" y="526" text-anchor="middle" font-size="15" fill="#1d2433">Symptomatic Rx:</text>
<text x="130.0" y="545.5" text-anchor="middle" font-size="15" fill="#1d2433">NSAID/aspirin/</text>
<text x="130.0" y="565" text-anchor="middle" font-size="15" fill="#1d2433">paracetamol</text>
<rect x="270" y="436" width="220" height="150" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="467.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Complicated</text>
<text x="380.0" y="487" text-anchor="middle" font-size="15" fill="#1d2433">LVEF &lt; 50%, acute HF,</text>
<text x="380.0" y="506.5" text-anchor="middle" font-size="15" fill="#1d2433">ventricular arrhythmia</text>
<text x="380.0" y="526" text-anchor="middle" font-size="15" fill="#1d2433">or advanced AV block</text>
<text x="380.0" y="545.5" text-anchor="middle" font-size="15" fill="#1d2433">HF therapy · consider</text>
<text x="380.0" y="565" text-anchor="middle" font-size="15" fill="#1d2433">EMB, genetic testing</text>
<rect x="520" y="436" width="220" height="150" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="630.0" y="467.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Fulminant</text>
<text x="630.0" y="487" text-anchor="middle" font-size="15" fill="#1d2433">Cardiogenic shock</text>
<text x="630.0" y="506.5" text-anchor="middle" font-size="15" fill="#1d2433">Shock team, IABP →</text>
<text x="630.0" y="526" text-anchor="middle" font-size="15" fill="#1d2433">VA-ECMO early</text>
<text x="630.0" y="545.5" text-anchor="middle" font-size="15" fill="#1d2433">Urgent EMB</text>
<text x="630.0" y="565" text-anchor="middle" font-size="15" fill="#1d2433">(giant-cell, etc.)</text>
<polyline points="130,586 130,604.2 630,604.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,586 380,604.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="630,586 630,604.2" fill="none" stroke="#444" stroke-width="2.2"/>
<circle cx="380" cy="616" r="4" fill="#444"/>
<polyline points="380,604.2 380,638" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="638" width="720" height="110" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="669" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">For all</text>
<text x="380.0" y="688.5" text-anchor="middle" font-size="15" fill="#1d2433">Beta-blocker ≥ 6 months (ESC IIa) · no routine steroids/antivirals</text>
<text x="380.0" y="708" text-anchor="middle" font-size="15" fill="#1d2433">Restrict exercise ≥ 1 month, then individualise (CMR, Holter, exercise test)</text>
<text x="380.0" y="727.5" text-anchor="middle" font-size="15" fill="#1d2433">Follow-up with troponin, CRP, ECG, echo, CMR within 6 months</text>
<text x="380" y="773" text-anchor="middle" font-size="13" fill="#666">IMPS = inflammatory myopericardial syndrome · EMB = endomyocardial biopsy · Adapted from 2025 ESC guidelines</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="570" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Tumor lysis syndrome: prevent by risk, treat early</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Before chemotherapy for a hematologic malignancy</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">Assess TLS risk: tumor type, WBC, LDH, bulk, baseline creatinine and uric acid</text>
<polyline points="380,110 380,118 135,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,118 135,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,118 380,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,118 625,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,118 625,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="230" height="128" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="135.0" y="176.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Low risk (&lt; 1%)</text>
<text x="135.0" y="193.7" text-anchor="middle" font-size="12" fill="#1d2433">Most solid tumors,</text>
<text x="135.0" y="210.6" text-anchor="middle" font-size="12" fill="#1d2433">indolent lymphoma</text>
<text x="135.0" y="227.5" text-anchor="middle" font-size="12" fill="#1d2433">Labs once daily</text>
<text x="135.0" y="244.4" text-anchor="middle" font-size="12" fill="#1d2433">Hydration, watch</text>
<rect x="265" y="142" width="230" height="128" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="176.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Intermediate (1–5%)</text>
<text x="380.0" y="193.7" text-anchor="middle" font-size="12" fill="#1d2433">AML WBC 25–100K,</text>
<text x="380.0" y="210.6" text-anchor="middle" font-size="12" fill="#1d2433">ALL WBC &lt; 100K</text>
<text x="380.0" y="227.5" text-anchor="middle" font-size="12" fill="#1d2433">IV hydration + allopurinol</text>
<text x="380.0" y="244.4" text-anchor="middle" font-size="12" fill="#1d2433">Labs every 8–12 h</text>
<rect x="510" y="142" width="230" height="128" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="625.0" y="176.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">High risk (&gt; 5%)</text>
<text x="625.0" y="193.7" text-anchor="middle" font-size="12" fill="#1d2433">Burkitt, ALL/AML</text>
<text x="625.0" y="210.6" text-anchor="middle" font-size="12" fill="#1d2433">WBC &gt; 100K, bulky DLBCL</text>
<text x="625.0" y="227.5" text-anchor="middle" font-size="12" fill="#1d2433">Hydration + rasburicase</text>
<text x="625.0" y="244.4" text-anchor="middle" font-size="12" fill="#1d2433">Labs every 4–6 h</text>
<polyline points="135,270 135,280" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,270 380,280" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,270 625,280" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,280 625,280" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,280 380,306" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="306" width="720" height="80" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="333.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Laboratory TLS = ≥ 2 within 24 h (3 days before to 7 days after chemo)</text>
<text x="380.0" y="350.6" text-anchor="middle" font-size="13" fill="#1d2433">Uric acid ≥ 8 mg/dL · K ≥ 6 mEq/L · Phosphate ≥ 4.5 mg/dL · Ca ≤ 7 mg/dL (or 25% change)</text>
<text x="380.0" y="367.5" text-anchor="middle" font-size="13" fill="#1d2433">Clinical TLS = laboratory TLS + creatinine &gt; 1.5 × ULN, arrhythmia, or seizure</text>
<polyline points="380,386 380,418" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="418" width="720" height="100" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="447.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Treat established TLS</text>
<text x="380.0" y="464.1" text-anchor="middle" font-size="13" fill="#1d2433">Cardiac monitoring · IV fluids (no K, no Ca) · rasburicase if not given (check G6PD)</text>
<text x="380.0" y="481.1" text-anchor="middle" font-size="13" fill="#1d2433">Treat hyperkalemia · give calcium only for symptomatic hypocalcemia · phosphate binder</text>
<text x="380.0" y="497.9" text-anchor="middle" font-size="13" fill="#1d2433">Dialysis: oliguria, fluid overload, refractory K, symptomatic low Ca, Ca × P ≥ 70</text>
<text x="380" y="542" text-anchor="middle" font-size="12" fill="#666">TLS = tumor lysis syndrome · DLBCL = diffuse large B-cell lymphoma · ULN = upper limit of normal</text>
<text x="380" y="560" text-anchor="middle" font-size="12" fill="#666">Adapted from StatPearls Tumor Lysis Syndrome (Cairo-Bishop criteria and international risk classification)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 636" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="636" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Microcytic anemia: confirm iron deficiency, then find the cause</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Microcytic anemia (MCV &lt; 80 fL)</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">Serum ferritin ± transferrin saturation (TSAT) + CRP</text>
<polyline points="380,110 380,118 135,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,118 135,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,118 380,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,118 625,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,118 625,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="230" height="100" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="135.0" y="171.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Ferritin &lt; 30 µg/L</text>
<text x="135.0" y="188.2" text-anchor="middle" font-size="12" fill="#1d2433">(&lt; 45 improves sensitivity)</text>
<text x="135.0" y="205.1" text-anchor="middle" font-size="12" fill="#1d2433">Iron deficiency</text>
<text x="135.0" y="221.9" text-anchor="middle" font-size="12" fill="#1d2433">confirmed</text>
<rect x="265" y="142" width="230" height="100" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="171.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Ferritin 30–150 µg/L</text>
<text x="380.0" y="188.2" text-anchor="middle" font-size="12" fill="#1d2433">+ inflammation (CRP ↑)</text>
<text x="380.0" y="205.1" text-anchor="middle" font-size="12" fill="#1d2433">TSAT &lt; 20% → combined</text>
<text x="380.0" y="221.9" text-anchor="middle" font-size="12" fill="#1d2433">IDA + ACD likely</text>
<rect x="510" y="142" width="230" height="100" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="625.0" y="171.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Ferritin normal / high</text>
<text x="625.0" y="188.2" text-anchor="middle" font-size="12" fill="#1d2433">TSAT normal</text>
<text x="625.0" y="205.1" text-anchor="middle" font-size="12" fill="#1d2433">→ Hb typing (thal, HbE)</text>
<text x="625.0" y="221.9" text-anchor="middle" font-size="12" fill="#1d2433">lead level · marrow iron stain</text>
<polyline points="135,242 135,252" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,242 380,252" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,252 380,252" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="257,252 257,278" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="278" width="720" height="80" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="305.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Find the source of iron loss — never stop at "IDA"</text>
<text x="380.0" y="322.6" text-anchor="middle" font-size="13" fill="#1d2433">Premenopausal woman: menses, pregnancy, diet · Child: cow milk, hookworm, lead</text>
<text x="380.0" y="339.5" text-anchor="middle" font-size="13" fill="#1d2433">Man / postmenopausal woman: gastroscopy + colonoscopy, celiac serology, urinalysis</text>
<polyline points="380,358 380,390" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="390" width="720" height="100" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="419.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Start iron now — do not wait for endoscopy (unless colonoscopy is imminent)</text>
<text x="380.0" y="436.1" text-anchor="middle" font-size="13" fill="#1d2433">Oral iron 1 tablet/day (ferrous sulfate / fumarate) or alternate days if GI upset</text>
<text x="380.0" y="453.1" text-anchor="middle" font-size="13" fill="#1d2433">Reticulocytes rise first (peak ~ day 5–10) · Hb ↑ ≥ 1 g/dL in 2 weeks = response</text>
<text x="380.0" y="469.9" text-anchor="middle" font-size="13" fill="#1d2433">Continue ~ 3 months after Hb normal to refill stores (ferritin)</text>
<polyline points="380,490 380,522" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="522" width="720" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="549.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">No response at 4 weeks → check adherence, ongoing bleeding, malabsorption</text>
<text x="380.0" y="566.0" text-anchor="middle" font-size="13" fill="#1d2433">(celiac, H. pylori, bariatric) or wrong diagnosis (thal, ACD) → IV iron if indicated</text>
<text x="380" y="608" text-anchor="middle" font-size="12" fill="#666">IDA = iron deficiency anemia · ACD = anemia of chronic disease · TSAT = transferrin saturation</text>
<text x="380" y="626" text-anchor="middle" font-size="12" fill="#666">Adapted from BSG guidelines for IDA in adults (Snook 2021, Gut) and StatPearls Iron-Deficiency Anemia</text>
</svg>

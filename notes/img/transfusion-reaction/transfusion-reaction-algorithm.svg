<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 708" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="708" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Transfusion reactions: stop first, then sort</text>
<rect x="20" y="48" width="720" height="80" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="75.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Any new symptom during or after a transfusion</text>
<text x="380.0" y="92.6" text-anchor="middle" font-size="13" fill="#1d2433">STOP the transfusion · keep IV open with 0.9% NaCl · vital signs every 15 min</text>
<text x="380.0" y="109.5" text-anchor="middle" font-size="13" fill="#1d2433">Check patient ID against the bag label · send bag + fresh sample to the blood bank</text>
<polyline points="380,128 380,136 135,136" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,136 135,160" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,136 502,136" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="502,136 502,160" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="160" width="230" height="46" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="135.0" y="187.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Mild and stable</text>
<rect x="265" y="160" width="475" height="46" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="502.5" y="187.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Severe: hypotension, dyspnea, dark urine, pain</text>
<polyline points="135,206 135,214 32,214" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="32,214 32,365.0" fill="none" stroke="#444" stroke-width="2.2"/>
<rect x="60" y="224" width="190" height="86" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="155.0" y="246.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Urticaria / itch only</text>
<text x="155.0" y="263.1" text-anchor="middle" font-size="12" fill="#1d2433">Antihistamine</text>
<text x="155.0" y="280.1" text-anchor="middle" font-size="12" fill="#1d2433">Restart slowly if it</text>
<text x="155.0" y="296.9" text-anchor="middle" font-size="12" fill="#1d2433">settles, no dyspnea</text>
<polyline points="32,267.0 60,267.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="60" y="322" width="190" height="86" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="155.0" y="344.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Fever ≥ 38 °C, rise ≥ 1 °C</text>
<text x="155.0" y="361.1" text-anchor="middle" font-size="12" fill="#1d2433">FNHTR (exclusion)</text>
<text x="155.0" y="378.1" text-anchor="middle" font-size="12" fill="#1d2433">Paracetamol · watch for</text>
<text x="155.0" y="394.9" text-anchor="middle" font-size="12" fill="#1d2433">hemolysis or sepsis</text>
<polyline points="32,365.0 60,365.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="502,206 502,214 277,214" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="277,214 277,484.0" fill="none" stroke="#444" stroke-width="2.2"/>
<rect x="305" y="224" width="435" height="64" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="522.5" y="243.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Fever, back pain, dark urine, shock</text>
<text x="522.5" y="260.6" text-anchor="middle" font-size="12" fill="#1d2433">Acute hemolytic (ABO) or bacterial contamination</text>
<text x="522.5" y="277.5" text-anchor="middle" font-size="12" fill="#1d2433">Fluids, DAT, recheck group, cultures, DIC, K</text>
<polyline points="277,256.0 305,256.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="305" y="300" width="435" height="64" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="522.5" y="319.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Shock + wheeze, stridor, angioedema</text>
<text x="522.5" y="336.6" text-anchor="middle" font-size="12" fill="#1d2433">Anaphylaxis (think anti-IgA)</text>
<text x="522.5" y="353.5" text-anchor="middle" font-size="12" fill="#1d2433">IM adrenaline · IgA-deficient products later</text>
<polyline points="277,332.0 305,332.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="305" y="376" width="435" height="64" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="522.5" y="395.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Dyspnea + high BP, JVP up, crackles</text>
<text x="522.5" y="412.6" text-anchor="middle" font-size="12" fill="#1d2433">TACO (BNP high, fast or large volume)</text>
<text x="522.5" y="429.5" text-anchor="middle" font-size="12" fill="#1d2433">Sit up, O2, furosemide, slower rate</text>
<polyline points="277,408.0 305,408.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="305" y="452" width="435" height="64" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="522.5" y="471.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Hypoxemia ≤ 6 h, infiltrates, low BP</text>
<text x="522.5" y="488.6" text-anchor="middle" font-size="12" fill="#1d2433">TRALI (non-cardiogenic edema)</text>
<text x="522.5" y="505.5" text-anchor="middle" font-size="12" fill="#1d2433">O2 / ventilation · avoid diuretic</text>
<polyline points="277,484.0 305,484.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="380" y="542" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f5f99">Delayed reactions — days to weeks</text>
<rect x="20" y="556" width="230" height="100" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="135.0" y="576.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Delayed hemolytic</text>
<text x="135.0" y="593.7" text-anchor="middle" font-size="12" fill="#1d2433">1–2 weeks (24 h–28 d)</text>
<text x="135.0" y="610.6" text-anchor="middle" font-size="12" fill="#1d2433">Anemia, jaundice</text>
<text x="135.0" y="627.5" text-anchor="middle" font-size="12" fill="#1d2433">DAT + and IAT +</text>
<text x="135.0" y="644.4" text-anchor="middle" font-size="12" fill="#1d2433">Antigen-negative blood</text>
<rect x="265" y="556" width="230" height="100" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="576.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">TA-GVHD</text>
<text x="380.0" y="593.7" text-anchor="middle" font-size="12" fill="#1d2433">4–30 days</text>
<text x="380.0" y="610.6" text-anchor="middle" font-size="12" fill="#1d2433">Rash, LFT up, pancytopenia</text>
<text x="380.0" y="627.5" text-anchor="middle" font-size="12" fill="#1d2433">High mortality</text>
<text x="380.0" y="644.4" text-anchor="middle" font-size="12" fill="#1d2433">Prevent: irradiation</text>
<rect x="510" y="556" width="230" height="100" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="625.0" y="576.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Post-transfusion purpura</text>
<text x="625.0" y="593.7" text-anchor="middle" font-size="12" fill="#1d2433">5–10 days</text>
<text x="625.0" y="610.6" text-anchor="middle" font-size="12" fill="#1d2433">Severe thrombocytopenia</text>
<text x="625.0" y="627.5" text-anchor="middle" font-size="12" fill="#1d2433">Anti-HPA-1a</text>
<text x="625.0" y="644.4" text-anchor="middle" font-size="12" fill="#1d2433">IVIG</text>
<text x="380" y="680" text-anchor="middle" font-size="12" fill="#666">FNHTR = febrile non-hemolytic · TACO = circulatory overload · TRALI = acute lung injury · IAT = indirect antiglobulin test</text>
<text x="380" y="698" text-anchor="middle" font-size="12" fill="#666">Adapted from StatPearls: Transfusion Reactions, Noninfectious Complications, Hemolytic Transfusion Reaction</text>
</svg>

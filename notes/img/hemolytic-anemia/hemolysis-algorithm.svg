<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 634" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="634" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Hemolytic anemia: DAT splits the road</text>
<rect x="20" y="48" width="720" height="80" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Hemolysis = anemia + reticulocytosis + high indirect bilirubin + high LDH + low haptoglobin</text>
<text x="380.0" y="92.6" text-anchor="middle" font-size="13" fill="#1d2433">Intravascular clue: dark urine (hemoglobinuria), urine blood + but few RBC</text>
<text x="380.0" y="109.5" text-anchor="middle" font-size="13" fill="#1d2433">Next: peripheral blood smear + direct antiglobulin test (DAT, monospecific IgG / C3d)</text>
<polyline points="380,128 380,136 195,136" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,136 195,160" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,136 565,136" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,136 565,160" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="160" width="350" height="46" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="195.0" y="187.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">DAT positive = immune</text>
<rect x="390" y="160" width="350" height="46" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="565.0" y="187.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">DAT negative = non-immune</text>
<polyline points="195,206 195,214 32,214" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="32,214 32,526.0" fill="none" stroke="#444" stroke-width="2.2"/>
<rect x="60" y="224" width="310" height="76" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="215.0" y="249.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">IgG ± C3d, spherocytes</text>
<text x="215.0" y="266.6" text-anchor="middle" font-size="12" fill="#1d2433">Warm AIHA: find SLE, CLL, lymphoma, drugs</text>
<text x="215.0" y="283.5" text-anchor="middle" font-size="12" fill="#1d2433">Prednisolone first · add rituximab if severe</text>
<polyline points="32,262.0 60,262.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="60" y="312" width="310" height="76" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="215.0" y="329.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">C3d only, RBC agglutination, cold</text>
<text x="215.0" y="346.1" text-anchor="middle" font-size="12" fill="#1d2433">Cold agglutinin disease (titer ≥ 64)</text>
<text x="215.0" y="363.1" text-anchor="middle" font-size="12" fill="#1d2433">Keep warm · rituximab ± bendamustine</text>
<text x="215.0" y="379.9" text-anchor="middle" font-size="12" fill="#1d2433">Steroid and splenectomy do not work</text>
<polyline points="32,350.0 60,350.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="60" y="400" width="310" height="76" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="215.0" y="425.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Transfused 3–14 days ago</text>
<text x="215.0" y="442.6" text-anchor="middle" font-size="12" fill="#1d2433">Delayed hemolytic transfusion reaction</text>
<text x="215.0" y="459.5" text-anchor="middle" font-size="12" fill="#1d2433">DAT + and indirect Coombs + (alloantibody)</text>
<polyline points="32,438.0 60,438.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="60" y="488" width="310" height="76" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="215.0" y="513.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Newborn, mother group O or Rh −</text>
<text x="215.0" y="530.6" text-anchor="middle" font-size="12" fill="#1d2433">ABO / Rh hemolytic disease</text>
<text x="215.0" y="547.5" text-anchor="middle" font-size="12" fill="#1d2433">Phototherapy ± exchange transfusion</text>
<polyline points="32,526.0 60,526.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="565,206 565,214 402,214" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="402,214 402,551.0" fill="none" stroke="#444" stroke-width="2.2"/>
<rect x="430" y="224" width="310" height="62" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="585.0" y="242.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Bite / blister cells, Heinz bodies</text>
<text x="585.0" y="259.6" text-anchor="middle" font-size="12" fill="#1d2433">G6PD deficiency: after infection, drug, fava</text>
<text x="585.0" y="276.5" text-anchor="middle" font-size="12" fill="#1d2433">Stop trigger · PRC if severe · assay later</text>
<polyline points="402,255.0 430,255.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="430" y="298" width="310" height="62" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="585.0" y="316.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Schistocytes + low platelets</text>
<text x="585.0" y="333.6" text-anchor="middle" font-size="12" fill="#1d2433">MAHA: TTP, HUS, DIC, HELLP</text>
<text x="585.0" y="350.5" text-anchor="middle" font-size="12" fill="#1d2433">TTP → urgent plasma exchange</text>
<polyline points="402,329.0 430,329.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="430" y="372" width="310" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="585.0" y="390.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Spherocytes + family history</text>
<text x="585.0" y="407.6" text-anchor="middle" font-size="12" fill="#1d2433">Hereditary spherocytosis</text>
<text x="585.0" y="424.5" text-anchor="middle" font-size="12" fill="#1d2433">Osmotic fragility / EMA test</text>
<polyline points="402,403.0 430,403.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="430" y="446" width="310" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="585.0" y="464.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Hemoglobinuria + cytopenia/thrombosis</text>
<text x="585.0" y="481.6" text-anchor="middle" font-size="12" fill="#1d2433">PNH: flow cytometry CD55/CD59 (FLAER)</text>
<text x="585.0" y="498.5" text-anchor="middle" font-size="12" fill="#1d2433">C5 inhibitor (eculizumab)</text>
<polyline points="402,477.0 430,477.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="430" y="520" width="310" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="585.0" y="547.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Microcytic, target cells, splenomegaly</text>
<text x="585.0" y="564.0" text-anchor="middle" font-size="12" fill="#1d2433">Thalassemia → Hb typing</text>
<polyline points="402,551.0 430,551.0" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="380" y="606" text-anchor="middle" font-size="12" fill="#666">AIHA = autoimmune hemolytic anemia · MAHA = microangiopathic hemolytic anemia · PNH = paroxysmal nocturnal hemoglobinuria</text>
<text x="380" y="624" text-anchor="middle" font-size="12" fill="#666">Adapted from Jäger 2020 AIHA consensus, Berentsen 2025 (ASH) and StatPearls (G6PD, immune hemolytic anemia)</text>
</svg>

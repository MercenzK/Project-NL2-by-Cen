<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 654" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="654" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Pneumothorax: initial management</text>
<rect x="20" y="48" width="720" height="56" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="71.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Suspected pneumothorax — tension physiology?</text>
<text x="380.0" y="91" text-anchor="middle" font-size="15" fill="#1d2433">Hypotension, hypoxia, tracheal deviation, distended neck veins</text>
<polyline points="250,104 250,136" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="272" y="128" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<polyline points="625,104 625,136" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="650" y="128" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="510" y="136" width="230" height="130" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="625.0" y="167.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Tension pneumothorax</text>
<text x="625.0" y="186.8" text-anchor="middle" font-size="15" fill="#1d2433">Needle decompression</text>
<text x="625.0" y="206.2" text-anchor="middle" font-size="15" fill="#1d2433">or finger thoracostomy</text>
<text x="625.0" y="225.8" text-anchor="middle" font-size="15" fill="#1d2433">→ chest drain</text>
<text x="625.0" y="245.2" text-anchor="middle" font-size="15" fill="#1d2433">Do not wait for X-ray</text>
<rect x="20" y="136" width="460" height="64" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="250.0" y="163.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Stable: confirm with CXR (or US/CT)</text>
<text x="250.0" y="183" text-anchor="middle" font-size="15" fill="#1d2433">Primary or secondary spontaneous?</text>
<polyline points="250,200 250,224" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="224" width="460" height="130" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="250.0" y="259" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Any high-risk feature?</text>
<text x="250.0" y="278.5" text-anchor="middle" font-size="15" fill="#1d2433">Haemodynamic instability · significant hypoxia</text>
<text x="250.0" y="298" text-anchor="middle" font-size="15" fill="#1d2433">Bilateral pneumothorax · haemopneumothorax</text>
<text x="250.0" y="329.5" text-anchor="middle" font-size="15" fill="#1d2433">Secondary SP (lung disease or age &gt; 50 + smoker)</text>
<polyline points="480,304 625,304" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,304 625,332" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="506" y="296" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="510" y="332" width="230" height="90" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="625.0" y="372.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Chest drain (ICD)</text>
<text x="625.0" y="392" text-anchor="middle" font-size="15" fill="#1d2433">and admit</text>
<polyline points="250,354 250,380" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="272" y="374" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="20" y="380" width="460" height="52" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="250.0" y="411.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Symptom burden (PSP without high-risk features)</text>
<polyline points="250,432 250,437.6 130,437.6 130,443.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="130,443.2 130,464" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="250,437.6 370,437.6 370,443.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="370,443.2 370,464" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="464" width="220" height="150" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="130.0" y="505.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Minimal or none</text>
<text x="130.0" y="524.8" text-anchor="middle" font-size="15" fill="#1d2433">Conservative care</text>
<text x="130.0" y="544.2" text-anchor="middle" font-size="15" fill="#1d2433">regardless of size</text>
<text x="130.0" y="563.8" text-anchor="middle" font-size="15" fill="#1d2433">Outpatient review</text>
<text x="130.0" y="583.2" text-anchor="middle" font-size="15" fill="#1d2433">Return if worse</text>
<rect x="260" y="464" width="220" height="150" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="370.0" y="495.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Symptomatic</text>
<text x="370.0" y="515" text-anchor="middle" font-size="15" fill="#1d2433">Shared decision:</text>
<text x="370.0" y="534.5" text-anchor="middle" font-size="15" fill="#1d2433">needle aspiration</text>
<text x="370.0" y="554" text-anchor="middle" font-size="15" fill="#1d2433">(≤ 2.5 L) or</text>
<text x="370.0" y="573.5" text-anchor="middle" font-size="15" fill="#1d2433">ambulatory device</text>
<text x="370.0" y="593" text-anchor="middle" font-size="15" fill="#1d2433">Fails → chest drain</text>
<rect x="510" y="464" width="230" height="150" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="625.0" y="495.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">After recovery</text>
<text x="625.0" y="515" text-anchor="middle" font-size="15" fill="#1d2433">Stop smoking</text>
<text x="625.0" y="534.5" text-anchor="middle" font-size="15" fill="#1d2433">No air travel until</text>
<text x="625.0" y="554" text-anchor="middle" font-size="15" fill="#1d2433">fully resolved</text>
<text x="625.0" y="573.5" text-anchor="middle" font-size="15" fill="#1d2433">Surgery (VATS) if</text>
<text x="625.0" y="593" text-anchor="middle" font-size="15" fill="#1d2433">recurrent or air leak</text>
<text x="380" y="636" text-anchor="middle" font-size="13" fill="#666">PSP/SP = primary/spontaneous pneumothorax · Adapted from BTS 2023 and ERS/EACTS/ESTS 2024</text>
</svg>

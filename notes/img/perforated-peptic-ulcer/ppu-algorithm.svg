<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 712" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="712" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Perforated peptic ulcer: approach</text>
<rect x="20" y="48" width="720" height="78" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="74.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Sudden severe epigastric pain → generalized, board-like rigidity</text>
<text x="380.0" y="91.5" text-anchor="middle" font-size="13" fill="#1d2433">Risk: NSAIDs / steroids, H. pylori, smoking, alcohol, elderly</text>
<text x="380.0" y="108.4" text-anchor="middle" font-size="13" fill="#1d2433">Labs + ABG (WBC, lactate, amylase, creatinine) · assess sepsis (qSOFA / SOFA)</text>
<polyline points="380,126 380,158" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="158" width="720" height="62" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="185.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Resuscitate: IV fluid, NPO, nasogastric tube, IV PPI, analgesia</text>
<text x="380.0" y="202.0" text-anchor="middle" font-size="13" fill="#1d2433">Start broad-spectrum IV antibiotics early (Gram −, Gram +, anaerobes)</text>
<polyline points="380,220 380,252" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="252" width="720" height="62" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="279.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Imaging: CT abdomen (preferred) · erect CXR / left lateral decubitus if no CT</text>
<text x="380.0" y="296.0" text-anchor="middle" font-size="13" fill="#1d2433">Free air seen in only 30–85% on plain film</text>
<polyline points="380,314 380,322 195,322" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,322 195,346" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,322 565,322" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,322 565,346" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="346" width="350" height="94" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="195.0" y="372.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Free air / contrast leak</text>
<text x="195.0" y="389.1" text-anchor="middle" font-size="13" fill="#1d2433">or peritonitis</text>
<text x="195.0" y="406.0" text-anchor="middle" font-size="13" fill="#1d2433">→ surgery as soon as possible</text>
<text x="195.0" y="422.9" text-anchor="middle" font-size="13" fill="#1d2433">(delay ↑ mortality, esp. age &gt; 70)</text>
<rect x="390" y="346" width="350" height="94" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="565.0" y="372.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">No free air but strong suspicion</text>
<text x="565.0" y="389.1" text-anchor="middle" font-size="13" fill="#1d2433">Water-soluble contrast (oral / NGT)</text>
<text x="565.0" y="406.0" text-anchor="middle" font-size="13" fill="#1d2433">+ CT, or left lateral decubitus film</text>
<text x="565.0" y="422.9" text-anchor="middle" font-size="13" fill="#1d2433">Sealed leak → NOM only if highly selected</text>
<polyline points="195,440 195,472" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="472" width="720" height="94" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="498.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Surgery</text>
<text x="380.0" y="515.1" text-anchor="middle" font-size="13" fill="#1d2433">Stable: laparoscopic repair (open if no skills / equipment) · Unstable: open surgery</text>
<text x="380.0" y="532.0" text-anchor="middle" font-size="13" fill="#1d2433">Ulcer &lt; 2 cm: primary repair ± omental patch · ≥ 2 cm: tailored (gastric → resection + frozen section)</text>
<text x="380.0" y="548.9" text-anchor="middle" font-size="13" fill="#1d2433">Peritoneal fluid for culture · damage control if physiologically deranged</text>
<polyline points="380,566 380,598" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="598" width="720" height="62" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="625.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">After repair: antibiotics 3–5 days (if source controlled) · continue PPI</text>
<text x="380.0" y="642.0" text-anchor="middle" font-size="13" fill="#1d2433">Test and treat H. pylori · stop NSAIDs · endoscopy to exclude malignancy (gastric ulcer)</text>
<text x="380" y="684" text-anchor="middle" font-size="12" fill="#666">NOM = non-operative management · NGT = nasogastric tube · ABG = arterial blood gas</text>
<text x="380" y="702" text-anchor="middle" font-size="12" fill="#666">Adapted from WSES guidelines: perforated and bleeding peptic ulcer (2020)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 732" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="732" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Preventing contrast-associated AKI</text>
<rect x="110" y="48" width="540" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Planned iodine-based contrast study</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">Check eGFR (≤ 7 days if acutely ill / inpatient,</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">≤ 3 months otherwise) in patients with risk history</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="130" y="156" width="500" height="96" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">At risk of CA-AKI?</text>
<text x="380.0" y="199.5" text-anchor="middle" font-size="15" fill="#1d2433">IV or 2nd-pass IA contrast: eGFR &lt; 30</text>
<text x="380.0" y="219" text-anchor="middle" font-size="15" fill="#1d2433">1st-pass IA contrast (e.g. cardiac cath) or ICU: eGFR &lt; 45</text>
<text x="380.0" y="238.5" text-anchor="middle" font-size="15" fill="#1d2433">Known or suspected AKI</text>
<polyline points="130,204 90,204 90,268.1" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="90,268.1 90,298" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="630,204 670,204 670,268.1" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="670,268.1 670,298" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="110" y="196" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<text x="650" y="196" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="20" y="298" width="260" height="130" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="150.0" y="329.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Not at risk</text>
<text x="150.0" y="348.8" text-anchor="middle" font-size="15" fill="#1d2433">No prophylaxis needed</text>
<text x="150.0" y="368.2" text-anchor="middle" font-size="15" fill="#1d2433">Do not delay</text>
<text x="150.0" y="387.8" text-anchor="middle" font-size="15" fill="#1d2433">necessary contrast study</text>
<text x="150.0" y="407.2" text-anchor="middle" font-size="15" fill="#1d2433">Metformin: continue</text>
<rect x="310" y="298" width="430" height="130" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="525.0" y="329.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">At risk</text>
<text x="525.0" y="348.8" text-anchor="middle" font-size="15" fill="#1d2433">Consider alternative imaging without contrast</text>
<text x="525.0" y="368.2" text-anchor="middle" font-size="15" fill="#1d2433">IV hydration: 0.9% saline 1 mL/kg/h</text>
<text x="525.0" y="387.8" text-anchor="middle" font-size="15" fill="#1d2433">3–4 h before and 4–6 h after</text>
<text x="525.0" y="407.2" text-anchor="middle" font-size="15" fill="#1d2433">(or 1.4% bicarbonate protocol)</text>
<polyline points="525,428 525,460" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="310" y="460" width="430" height="110" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="525.0" y="491" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">During and after</text>
<text x="525.0" y="510.5" text-anchor="middle" font-size="15" fill="#1d2433">Low- or iso-osmolar agent, lowest dose</text>
<text x="525.0" y="530" text-anchor="middle" font-size="15" fill="#1d2433">Stop metformin at time of contrast</text>
<text x="525.0" y="549.5" text-anchor="middle" font-size="15" fill="#1d2433">Check eGFR at 48 h; restart metformin if stable</text>
<rect x="20" y="602" width="720" height="86" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="630.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">No proven benefit</text>
<text x="380.0" y="650.2" text-anchor="middle" font-size="15" fill="#1d2433">N-acetylcysteine, sodium bicarbonate over saline, statins, prophylactic dialysis</text>
<text x="380.0" y="669.8" text-anchor="middle" font-size="15" fill="#1d2433">Individualise fluids in NYHA III–IV heart failure or eGFR &lt; 15</text>
<text x="380" y="714" text-anchor="middle" font-size="13" fill="#666">CA-AKI = contrast-associated AKI · IA = intra-arterial · Adapted from ESUR 2025 and ACR/NKF 2020</text>
</svg>

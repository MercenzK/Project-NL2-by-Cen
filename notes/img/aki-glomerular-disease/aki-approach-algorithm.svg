<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 768" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="768" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Rising creatinine: approach to AKI</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">AKI (KDIGO): Cr rise ≥ 0.3 mg/dL in 48 h, or ≥ 1.5 × baseline in 7 days, or urine &lt; 0.5 mL/kg/h for 6 h</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">Check K, HCO3, volume status · stop nephrotoxins (NSAIDs, contrast) · review ACEi/ARB, diuretics, metformin</text>
<polyline points="380,110 380,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="720" height="46" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="169.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Urgent dialysis if refractory: hyperkalemia, pulmonary edema, acidosis, uremic pericarditis / encephalopathy</text>
<polyline points="380,188 380,220" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="220" width="720" height="46" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="247.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Where is the problem? → history, volume status, bladder scan / renal ultrasound, urinalysis + microscopy</text>
<polyline points="380,266 380,274 135,274" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,274 135,298" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,274 380,298" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,274 625,274" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,274 625,298" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="298" width="230" height="112" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="135.0" y="324.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Pre-renal</text>
<text x="135.0" y="341.7" text-anchor="middle" font-size="12" fill="#1d2433">Hypovolemia, shock, HF</text>
<text x="135.0" y="358.6" text-anchor="middle" font-size="12" fill="#1d2433">NSAIDs, ACEi / ARB</text>
<text x="135.0" y="375.5" text-anchor="middle" font-size="12" fill="#1d2433">Bland urine, FENa &lt; 1%</text>
<text x="135.0" y="392.4" text-anchor="middle" font-size="12" fill="#1d2433">→ fluid challenge</text>
<rect x="265" y="298" width="230" height="112" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="324.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Intrinsic renal</text>
<text x="380.0" y="341.7" text-anchor="middle" font-size="12" fill="#1d2433">ATN: muddy brown casts</text>
<text x="380.0" y="358.6" text-anchor="middle" font-size="12" fill="#1d2433">AIN: WBC, WBC casts</text>
<text x="380.0" y="375.5" text-anchor="middle" font-size="12" fill="#1d2433">GN: dysmorphic RBC,</text>
<text x="380.0" y="392.4" text-anchor="middle" font-size="12" fill="#1d2433">RBC casts, proteinuria</text>
<rect x="510" y="298" width="230" height="112" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="625.0" y="324.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Post-renal</text>
<text x="625.0" y="341.7" text-anchor="middle" font-size="12" fill="#1d2433">Retention, BPH, stone,</text>
<text x="625.0" y="358.6" text-anchor="middle" font-size="12" fill="#1d2433">pelvic mass, phimosis</text>
<text x="625.0" y="375.5" text-anchor="middle" font-size="12" fill="#1d2433">US: hydronephrosis</text>
<text x="625.0" y="392.4" text-anchor="middle" font-size="12" fill="#1d2433">(bilateral or solitary kidney)</text>
<polyline points="135,410 135,442" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,410 380,442" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="625,410 625,442" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="442" width="230" height="130" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="135.0" y="469.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">ACEi / ARB rule (KDIGO)</text>
<text x="135.0" y="486.2" text-anchor="middle" font-size="12" fill="#1d2433">Cr rise &lt; 30% in 4 wk:</text>
<text x="135.0" y="503.2" text-anchor="middle" font-size="12" fill="#1d2433">continue</text>
<text x="135.0" y="520.1" text-anchor="middle" font-size="12" fill="#1d2433">Cr rise &gt; 30%: look for</text>
<text x="135.0" y="537.0" text-anchor="middle" font-size="12" fill="#1d2433">volume loss, NSAIDs,</text>
<text x="135.0" y="553.9" text-anchor="middle" font-size="12" fill="#1d2433">renal artery stenosis → reduce / stop</text>
<rect x="265" y="442" width="230" height="130" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="469.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Glomerular</text>
<text x="380.0" y="486.2" text-anchor="middle" font-size="12" fill="#1d2433">Nephritic: PSGN (low C3,</text>
<text x="380.0" y="503.2" text-anchor="middle" font-size="12" fill="#1d2433">1–3 wk after strep) or IgA</text>
<text x="380.0" y="520.1" text-anchor="middle" font-size="12" fill="#1d2433">(1–2 days, normal C3)</text>
<text x="380.0" y="537.0" text-anchor="middle" font-size="12" fill="#1d2433">Nephrotic: child → MCD</text>
<text x="380.0" y="553.9" text-anchor="middle" font-size="12" fill="#1d2433">→ prednisolone 60 mg/m²/day</text>
<rect x="510" y="442" width="230" height="130" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="625.0" y="469.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Relieve obstruction</text>
<text x="625.0" y="486.2" text-anchor="middle" font-size="12" fill="#1d2433">Urethral catheter first</text>
<text x="625.0" y="503.2" text-anchor="middle" font-size="12" fill="#1d2433">Watch post-obstructive</text>
<text x="625.0" y="520.1" text-anchor="middle" font-size="12" fill="#1d2433">diuresis (fluids, electrolytes)</text>
<text x="625.0" y="537.0" text-anchor="middle" font-size="12" fill="#1d2433">Then treat cause:</text>
<text x="625.0" y="553.9" text-anchor="middle" font-size="12" fill="#1d2433">BPH → α-blocker / TURP</text>
<polyline points="380,572 380,604" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="265" y="604" width="230" height="112" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="630.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Interstitial (AIN)</text>
<text x="380.0" y="647.7" text-anchor="middle" font-size="12" fill="#1d2433">New drug: NSAID, PPI,</text>
<text x="380.0" y="664.6" text-anchor="middle" font-size="12" fill="#1d2433">β-lactam, herbal remedy</text>
<text x="380.0" y="681.5" text-anchor="middle" font-size="12" fill="#1d2433">Sterile pyuria ± eosinophils</text>
<text x="380.0" y="698.4" text-anchor="middle" font-size="12" fill="#1d2433">→ stop drug ± steroid</text>
<text x="380" y="740" text-anchor="middle" font-size="12" fill="#666">FENa = fractional excretion of sodium · ATN = acute tubular necrosis · AIN = acute interstitial nephritis · MCD = minimal change disease</text>
<text x="380" y="758" text-anchor="middle" font-size="12" fill="#666">Adapted from StatPearls AKI (2026), KDIGO Diabetes in CKD (2022) and KDIGO Nephrotic Syndrome in Children (2025)</text>
</svg>

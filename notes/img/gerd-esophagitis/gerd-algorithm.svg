<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 832" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="832" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">GERD: diagnostic and treatment pathway</text>
<rect x="20" y="48" width="720" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="72.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Heartburn and/or regurgitation</text>
<text x="380.0" y="90.9" text-anchor="middle" font-size="14" fill="#1d2433">Chest pain without heartburn → exclude cardiac cause first (ECG)</text>
<text x="380.0" y="109.1" text-anchor="middle" font-size="14" fill="#1d2433">Recent pill intake + odynophagia → think pill esophagitis</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="60" y="156" width="640" height="60" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="181.8" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Alarm features?</text>
<text x="380.0" y="200" text-anchor="middle" font-size="14" fill="#1d2433">Dysphagia · odynophagia · weight loss · GI bleeding · anemia · persistent vomiting</text>
<polyline points="380,216 380,222 195,222 195,227.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,227.2 195,248" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,222 565,222 565,227.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,227.2 565,248" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="150" y="234.1" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<text x="620" y="234.1" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="20" y="248" width="350" height="110" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="195.0" y="280.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">EGD (with biopsy as needed)</text>
<text x="195.0" y="298.8" text-anchor="middle" font-size="14" fill="#1d2433">Esophagitis (LA grade), Barrett,</text>
<text x="195.0" y="317" text-anchor="middle" font-size="14" fill="#1d2433">stricture, cancer, EoE,</text>
<text x="195.0" y="335.2" text-anchor="middle" font-size="14" fill="#1d2433">pill or infectious esophagitis</text>
<rect x="390" y="248" width="350" height="110" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="565.0" y="280.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Lifestyle + empirical PPI</text>
<text x="565.0" y="298.8" text-anchor="middle" font-size="14" fill="#1d2433">Once daily, 30–60 min before a meal</text>
<text x="565.0" y="317" text-anchor="middle" font-size="14" fill="#1d2433">Thai 2020: 2-week PPI test,</text>
<text x="565.0" y="335.2" text-anchor="middle" font-size="14" fill="#1d2433">standard dose 4–8 wk · ACG: 8 wk</text>
<polyline points="565,358 565,390" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="390" y="390" width="350" height="60" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="565.0" y="424.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Symptoms controlled?</text>
<polyline points="565,450 565,464 475,464 475,476" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="475,476 475,498" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="565,464 655,464 655,476" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="655,476 655,498" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="450" y="478" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<text x="700" y="478" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="390" y="498" width="170" height="162" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="475.0" y="553.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Responder</text>
<text x="475.0" y="571.7" text-anchor="middle" font-size="14" fill="#1d2433">Try to stop</text>
<text x="475.0" y="589.9" text-anchor="middle" font-size="14" fill="#1d2433">or step down /</text>
<text x="475.0" y="608.1" text-anchor="middle" font-size="14" fill="#1d2433">on-demand PPI</text>
<text x="475.0" y="626.3" text-anchor="middle" font-size="14" fill="#1d2433">(NERD)</text>
<rect x="570" y="498" width="170" height="162" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="655.0" y="553.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Non-responder</text>
<text x="655.0" y="571.7" text-anchor="middle" font-size="14" fill="#1d2433">Check adherence</text>
<text x="655.0" y="589.9" text-anchor="middle" font-size="14" fill="#1d2433">and timing →</text>
<text x="655.0" y="608.1" text-anchor="middle" font-size="14" fill="#1d2433">double dose (bid)</text>
<text x="655.0" y="626.3" text-anchor="middle" font-size="14" fill="#1d2433">or switch PPI</text>
<polyline points="655,660 655,694" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="390" y="694" width="350" height="94" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="565.0" y="727.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Still refractory</text>
<text x="565.0" y="745.9" text-anchor="middle" font-size="14" fill="#1d2433">EGD off PPI 2–4 wk → if normal:</text>
<text x="565.0" y="764.1" text-anchor="middle" font-size="14" fill="#1d2433">pH-impedance monitoring + manometry</text>
<rect x="20" y="390" width="350" height="126" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="195.0" y="422.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">LA grade C/D or Barrett</text>
<text x="195.0" y="440.8" text-anchor="middle" font-size="14" fill="#1d2433">Long-term maintenance PPI</text>
<text x="195.0" y="459" text-anchor="middle" font-size="14" fill="#1d2433">or antireflux surgery</text>
<text x="195.0" y="477.2" text-anchor="middle" font-size="14" fill="#1d2433">Barrett → refer specialist</text>
<rect x="20" y="548" width="350" height="110" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="195.0" y="580.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Confirmed GERD, refractory</text>
<text x="195.0" y="598.8" text-anchor="middle" font-size="14" fill="#1d2433">regurgitation or large hiatal hernia</text>
<text x="195.0" y="617" text-anchor="middle" font-size="14" fill="#1d2433">→ fundoplication / MSA</text>
<text x="195.0" y="635.2" text-anchor="middle" font-size="14" fill="#1d2433">(manometry first: exclude achalasia)</text>
<rect x="20" y="692" width="350" height="96" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="195.0" y="726.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Normal pH test on PPI failure</text>
<text x="195.0" y="744.9" text-anchor="middle" font-size="14" fill="#1d2433">Functional heartburn /</text>
<text x="195.0" y="763.1" text-anchor="middle" font-size="14" fill="#1d2433">reflux hypersensitivity → stop PPI</text>
<polyline points="195,358 195,390" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="195,516 195,548" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="390,741 370,741" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="380" y="802" text-anchor="middle" font-size="11.5" fill="#666">LA = Los Angeles grade · NERD = non-erosive reflux disease · EoE = eosinophilic esophagitis · MSA = magnetic sphincter augmentation</text>
<text x="380" y="820" text-anchor="middle" font-size="12.5" fill="#666">Adapted from ACG clinical guideline for GERD 2022 and Thailand guideline 2020 for medical management of GERD</text>
</svg>

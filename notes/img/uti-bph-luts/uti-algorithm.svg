<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="570" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Urinary tract infection: approach</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Dysuria, frequency, urgency ± suprapubic pain</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">Ask: fever, flank pain, vaginal discharge, pregnancy · sex and age · catheter, obstruction, recent antibiotics</text>
<polyline points="380,110 380,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="720" height="46" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="169.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Classify the infection (dipstick: leukocyte esterase / nitrite · culture if not simple cystitis)</text>
<polyline points="380,188 380,196 135,196" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,196 135,220" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,196 380,220" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,196 625,196" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,196 625,220" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="220" width="230" height="150" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="135.0" y="248.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Uncomplicated cystitis</text>
<text x="135.0" y="265.8" text-anchor="middle" font-size="12" fill="#1d2433">Non-pregnant woman, afebrile</text>
<text x="135.0" y="282.7" text-anchor="middle" font-size="12" fill="#1d2433">Nitrofurantoin 100 mg bid × 5 d</text>
<text x="135.0" y="299.6" text-anchor="middle" font-size="12" fill="#1d2433">Fosfomycin 3 g single dose</text>
<text x="135.0" y="316.5" text-anchor="middle" font-size="12" fill="#1d2433">Pivmecillinam 400 mg tid × 3–5 d</text>
<text x="135.0" y="333.4" text-anchor="middle" font-size="12" fill="#1d2433">TMP-SMX 3 d if E. coli</text>
<text x="135.0" y="350.3" text-anchor="middle" font-size="12" fill="#1d2433">resistance &lt; 20%</text>
<rect x="265" y="220" width="230" height="150" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="248.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Pregnancy</text>
<text x="380.0" y="265.8" text-anchor="middle" font-size="12" fill="#1d2433">Screen and treat ASB</text>
<text x="380.0" y="282.7" text-anchor="middle" font-size="12" fill="#1d2433">Always send culture</text>
<text x="380.0" y="299.6" text-anchor="middle" font-size="12" fill="#1d2433">Penicillin (amoxicillin if</text>
<text x="380.0" y="316.5" text-anchor="middle" font-size="12" fill="#1d2433">susceptible), cephalosporin,</text>
<text x="380.0" y="333.4" text-anchor="middle" font-size="12" fill="#1d2433">fosfomycin, nitrofurantoin</text>
<text x="380.0" y="350.3" text-anchor="middle" font-size="12" fill="#1d2433">(avoid near term, G6PD)</text>
<rect x="510" y="220" width="230" height="150" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="625.0" y="248.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Pyelonephritis</text>
<text x="625.0" y="265.8" text-anchor="middle" font-size="12" fill="#1d2433">Fever, flank pain, CVA tenderness</text>
<text x="625.0" y="282.7" text-anchor="middle" font-size="12" fill="#1d2433">Culture + imaging if complicated</text>
<text x="625.0" y="299.6" text-anchor="middle" font-size="12" fill="#1d2433">Outpatient: fluoroquinolone</text>
<text x="625.0" y="316.5" text-anchor="middle" font-size="12" fill="#1d2433">(resistance &lt; 10%) or IV</text>
<text x="625.0" y="333.4" text-anchor="middle" font-size="12" fill="#1d2433">ceftriaxone dose + oral agent</text>
<text x="625.0" y="350.3" text-anchor="middle" font-size="12" fill="#1d2433">Admit if septic: IV therapy</text>
<polyline points="135,370 135,380" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,370 380,380" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,370 625,380" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,380 625,380" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,380 380,406" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="406" width="720" height="112" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="432.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Special groups</text>
<text x="380.0" y="449.7" text-anchor="middle" font-size="13" fill="#1d2433">Men: exclude acute prostatitis (fever, perineal pain, tender prostate) · cystitis in men: TMP-SMX 7 days</text>
<text x="380.0" y="466.6" text-anchor="middle" font-size="13" fill="#1d2433">Febrile child 2–24 mo: catheter or SPA urine · diagnose with abnormal UA + ≥ 50,000 CFU/mL</text>
<text x="380.0" y="483.5" text-anchor="middle" font-size="13" fill="#1d2433">Child: oral or parenteral antibiotic for 7–14 days · renal and bladder ultrasound after first febrile UTI</text>
<text x="380.0" y="500.4" text-anchor="middle" font-size="13" fill="#1d2433">Infection + obstruction (stone, retention) → urgent drainage plus antibiotics</text>
<text x="380" y="542" text-anchor="middle" font-size="12" fill="#666">ASB = asymptomatic bacteriuria · CVA = costovertebral angle · SPA = suprapubic aspiration · UA = urinalysis</text>
<text x="380" y="560" text-anchor="middle" font-size="12" fill="#666">Adapted from EAU Urological Infections guideline (2025) and AAP febrile UTI guideline (2011)</text>
</svg>

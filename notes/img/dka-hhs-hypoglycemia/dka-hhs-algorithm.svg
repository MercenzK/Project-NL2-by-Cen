<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 804" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="804" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">DKA and HHS in adults: first hours</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Suspected hyperglycemic crisis (adult)</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">Glucose, β-hydroxybutyrate, VBG, electrolytes, anion gap, BUN/Cr, osmolality, ECG · find precipitant</text>
<polyline points="380,110 380,118 195,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,118 195,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,118 565,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,118 565,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="350" height="96" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="195.0" y="169.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">DKA = D + K + A (all three)</text>
<text x="195.0" y="186.2" text-anchor="middle" font-size="13" fill="#1d2433">Glucose ≥ 200 mg/dL or known diabetes</text>
<text x="195.0" y="203.1" text-anchor="middle" font-size="13" fill="#1d2433">β-hydroxybutyrate ≥ 3.0 mmol/L or urine ketone ≥ 2+</text>
<text x="195.0" y="219.9" text-anchor="middle" font-size="13" fill="#1d2433">pH &lt; 7.3 and/or HCO3 &lt; 18 mmol/L</text>
<rect x="390" y="142" width="350" height="96" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="565.0" y="169.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">HHS (all four)</text>
<text x="565.0" y="186.2" text-anchor="middle" font-size="13" fill="#1d2433">Glucose ≥ 600 mg/dL</text>
<text x="565.0" y="203.1" text-anchor="middle" font-size="13" fill="#1d2433">Effective osmolality &gt; 300 (total &gt; 320)</text>
<text x="565.0" y="219.9" text-anchor="middle" font-size="13" fill="#1d2433">BHB &lt; 3.0 · pH ≥ 7.3 and HCO3 ≥ 15</text>
<polyline points="195,238 195,248" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,238 565,248" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,248 565,248" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,248 380,274" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="274" width="720" height="62" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="301.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">1) Fluids first: 0.9% NaCl or balanced crystalloid 500–1,000 mL/h for 2–4 h</text>
<text x="380.0" y="318.1" text-anchor="middle" font-size="13" fill="#1d2433">Then adjust to volume status and Na · replace deficit over 24–48 h (caution: elderly, heart or kidney disease)</text>
<polyline points="380,336 380,368" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="368" width="720" height="46" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="395.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">2) Check potassium BEFORE insulin</text>
<polyline points="380,414 380,422 135,422" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,422 135,446" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,422 380,446" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,422 625,422" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,422 625,446" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="446" width="230" height="96" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="135.0" y="473.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">K &lt; 3.5 mmol/L</text>
<text x="135.0" y="490.1" text-anchor="middle" font-size="12" fill="#1d2433">Hold insulin</text>
<text x="135.0" y="507.1" text-anchor="middle" font-size="12" fill="#1d2433">KCl 10 mmol/h</text>
<text x="135.0" y="524.0" text-anchor="middle" font-size="12" fill="#1d2433">until K &gt; 3.5</text>
<rect x="265" y="446" width="230" height="96" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="473.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">K 3.5–5.0 mmol/L</text>
<text x="380.0" y="490.1" text-anchor="middle" font-size="12" fill="#1d2433">Add 20–30 mmol K</text>
<text x="380.0" y="507.1" text-anchor="middle" font-size="12" fill="#1d2433">per litre of fluid</text>
<text x="380.0" y="524.0" text-anchor="middle" font-size="12" fill="#1d2433">Start insulin</text>
<rect x="510" y="446" width="230" height="96" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="625.0" y="473.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">K &gt; 5.0 mmol/L</text>
<text x="625.0" y="490.1" text-anchor="middle" font-size="12" fill="#1d2433">No potassium yet</text>
<text x="625.0" y="507.1" text-anchor="middle" font-size="12" fill="#1d2433">Start insulin</text>
<text x="625.0" y="524.0" text-anchor="middle" font-size="12" fill="#1d2433">Recheck K every 4 h</text>
<polyline points="135,542 135,552" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,542 380,552" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,542 625,552" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,552 625,552" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,552 380,578" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="578" width="720" height="80" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="605.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">3) Insulin: IV regular insulin 0.1 U/kg/h (mild–moderate DKA: SC rapid-acting every 1–2 h is an option)</text>
<text x="380.0" y="622.6" text-anchor="middle" font-size="13" fill="#1d2433">Glucose &lt; 250 → add 5–10% dextrose, reduce to 0.05 U/kg/h, keep glucose ~200 until ketoacidosis resolves</text>
<text x="380.0" y="639.5" text-anchor="middle" font-size="13" fill="#1d2433">HHS: glucose fall ≤ 90–120 mg/dL/h · osmolality fall 3–8 mOsm/kg/h · Na fall ≤ 10 mmol/L/24 h</text>
<polyline points="380,658 380,690" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="690" width="720" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="717.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Resolution: ketone &lt; 0.6 mmol/L + pH ≥ 7.3 or HCO3 ≥ 18 → start SC basal insulin 1–2 h before stopping IV</text>
<text x="380.0" y="734.0" text-anchor="middle" font-size="13" fill="#1d2433">Bicarbonate only if pH &lt; 7.0 · phosphate only if &lt; 1.0 mmol/L with weakness · glucose checks every 1–2 h</text>
<text x="380" y="776" text-anchor="middle" font-size="12" fill="#666">BHB = β-hydroxybutyrate · VBG = venous blood gas · SC = subcutaneous · children: follow ISPAD 2022</text>
<text x="380" y="794" text-anchor="middle" font-size="12" fill="#666">Adapted from Hyperglycemic Crises in Adults With Diabetes: A Consensus Report (ADA/EASD/JBDS/AACE/DTS 2024)</text>
</svg>

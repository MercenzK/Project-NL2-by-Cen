<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="570" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Bleeding work-up: platelets, PT and aPTT first</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Bleeding patient</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">CBC with platelet count + peripheral smear · PT/INR · aPTT</text>
<polyline points="380,110 380,118 195,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,118 195,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,118 565,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,118 565,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="350" height="62" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="195.0" y="169.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Platelets LOW</text>
<text x="195.0" y="186.1" text-anchor="middle" font-size="13" fill="#1d2433">(petechiae, mucosal bleeding)</text>
<rect x="390" y="142" width="350" height="62" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="565.0" y="169.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Platelets NORMAL</text>
<text x="565.0" y="186.1" text-anchor="middle" font-size="13" fill="#1d2433">(deep, joint, muscle bleeding → factor)</text>
<polyline points="195,204 195,212 102.5,212" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="102.5,212 102.5,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="195,212 287.5,212" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="287.5,212 287.5,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="565,204 565,212 472.5,212" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="472.5,212 472.5,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="565,212 657.5,212" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="657.5,212 657.5,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="236" width="165" height="128" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="102.5" y="270.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">PT, aPTT normal</text>
<text x="102.5" y="287.7" text-anchor="middle" font-size="12" fill="#1d2433">Isolated: ITP, drug,</text>
<text x="102.5" y="304.6" text-anchor="middle" font-size="12" fill="#1d2433">marrow failure</text>
<text x="102.5" y="321.5" text-anchor="middle" font-size="12" fill="#1d2433">Schistocytes + LDH ↑</text>
<text x="102.5" y="338.4" text-anchor="middle" font-size="12" fill="#1d2433">→ TTP / HUS</text>
<rect x="205" y="236" width="165" height="128" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="287.5" y="270.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">PT and aPTT long</text>
<text x="287.5" y="287.7" text-anchor="middle" font-size="12" fill="#1d2433">Fibrinogen ↓</text>
<text x="287.5" y="304.6" text-anchor="middle" font-size="12" fill="#1d2433">D-dimer ↑↑</text>
<text x="287.5" y="321.5" text-anchor="middle" font-size="12" fill="#1d2433">Schistocytes</text>
<text x="287.5" y="338.4" text-anchor="middle" font-size="12" fill="#1d2433">→ DIC (sepsis)</text>
<rect x="390" y="236" width="165" height="128" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="472.5" y="270.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">aPTT long only</text>
<text x="472.5" y="287.7" text-anchor="middle" font-size="12" fill="#1d2433">Mixing test corrects</text>
<text x="472.5" y="304.6" text-anchor="middle" font-size="12" fill="#1d2433">→ factor VIII / IX</text>
<text x="472.5" y="321.5" text-anchor="middle" font-size="12" fill="#1d2433">(hemophilia) or VWD</text>
<text x="472.5" y="338.4" text-anchor="middle" font-size="12" fill="#1d2433">No → inhibitor, LA</text>
<rect x="575" y="236" width="165" height="128" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="657.5" y="270.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">PT / INR long</text>
<text x="657.5" y="287.7" text-anchor="middle" font-size="12" fill="#1d2433">Warfarin, vitamin K</text>
<text x="657.5" y="304.6" text-anchor="middle" font-size="12" fill="#1d2433">deficiency, liver</text>
<text x="657.5" y="321.5" text-anchor="middle" font-size="12" fill="#1d2433">All normal + mucosal</text>
<text x="657.5" y="338.4" text-anchor="middle" font-size="12" fill="#1d2433">→ VWF tests</text>
<polyline points="102.5,364 102.5,374" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="287.5,364 287.5,374" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="472.5,364 472.5,374" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="657.5,364 657.5,374" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="102.5,374 657.5,374" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,374 380,400" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="400" width="720" height="118" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="429.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Treat by cause</text>
<text x="380.0" y="446.7" text-anchor="middle" font-size="13" fill="#1d2433">ITP: observe if mild · steroid if adult platelets &lt; 30,000 · TTP: plasma exchange + steroid</text>
<text x="380.0" y="463.6" text-anchor="middle" font-size="13" fill="#1d2433">DIC: treat sepsis/cause · replace platelets, FFP, cryo only if bleeding or procedure</text>
<text x="380.0" y="480.5" text-anchor="middle" font-size="13" fill="#1d2433">Hemophilia: factor VIII (A) / IX (B) at once, even before imaging · VWD: desmopressin / VWF</text>
<text x="380.0" y="497.4" text-anchor="middle" font-size="13" fill="#1d2433">Warfarin + major bleed: stop warfarin, IV vitamin K + 4F-PCC (FFP if no PCC)</text>
<text x="380" y="542" text-anchor="middle" font-size="12" fill="#666">LA = lupus anticoagulant · VWD = von Willebrand disease · 4F-PCC = 4-factor prothrombin complex concentrate</text>
<text x="380" y="560" text-anchor="middle" font-size="12" fill="#666">Adapted from ASH ITP 2019/2026, ISTH TTP 2020, ASH/ISTH/NHF/WFH VWD 2021 and StatPearls</text>
</svg>

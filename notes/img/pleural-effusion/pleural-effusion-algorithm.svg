<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 882" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="882" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Pleural effusion: diagnosis and pleural infection</text>
<rect x="80" y="48" width="600" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Pleural effusion on CXR / ultrasound</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">Obvious heart failure with bilateral effusions? → diuretics first</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">(tap if atypical, unilateral, febrile or not responding)</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="156" width="600" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="179.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Ultrasound-guided diagnostic thoracentesis</text>
<text x="380.0" y="199.2" text-anchor="middle" font-size="15" fill="#1d2433">Appearance, pH, protein, LDH, glucose, cell count</text>
<text x="380.0" y="218.8" text-anchor="middle" font-size="15" fill="#1d2433">Gram stain/culture (blood culture bottles), cytology, ADA</text>
<polyline points="380,232 380,264" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="264" width="600" height="76" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="287.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Light's criteria (any one = exudate)</text>
<text x="380.0" y="307.2" text-anchor="middle" font-size="15" fill="#1d2433">Fluid/serum protein &gt; 0.5 · fluid/serum LDH &gt; 0.6</text>
<text x="380.0" y="326.8" text-anchor="middle" font-size="15" fill="#1d2433">Fluid LDH &gt; 2/3 upper limit of normal serum LDH</text>
<polyline points="380,340 380,346.7 190,346.7 190,352.6" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="190,352.6 190,376" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,346.7 570,346.7 570,352.6" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="570,352.6 570,376" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="376" width="340" height="120" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="190.0" y="412" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Transudate</text>
<text x="190.0" y="431.5" text-anchor="middle" font-size="15" fill="#1d2433">Heart failure, cirrhosis,</text>
<text x="190.0" y="451" text-anchor="middle" font-size="15" fill="#1d2433">nephrotic syndrome, hypoalbuminemia</text>
<text x="190.0" y="470.5" text-anchor="middle" font-size="15" fill="#1d2433">→ treat the cause</text>
<rect x="400" y="376" width="340" height="120" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="570.0" y="412" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Exudate</text>
<text x="570.0" y="431.5" text-anchor="middle" font-size="15" fill="#1d2433">Neutrophils → parapneumonic/empyema</text>
<text x="570.0" y="451" text-anchor="middle" font-size="15" fill="#1d2433">Lymphocytes → TB (ADA ↑), malignancy</text>
<text x="570.0" y="470.5" text-anchor="middle" font-size="15" fill="#1d2433">Cytology → biopsy if negative</text>
<polyline points="570,496 570,528" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="170" y="528" width="570" height="52" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="455.0" y="559.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Parapneumonic effusion: check pleural fluid pH</text>
<polyline points="455,580 455,586 130,586 130,591.9" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="130,591.9 130,614" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="455,586 455,614" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="455,586 660,586 660,591.9" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="660,591.9 660,614" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="614" width="220" height="130" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="130.0" y="645.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Pus or pH ≤ 7.2</text>
<text x="130.0" y="664.8" text-anchor="middle" font-size="15" fill="#1d2433">(or glucose &lt; 60)</text>
<text x="130.0" y="684.2" text-anchor="middle" font-size="15" fill="#1d2433">→ chest drain</text>
<text x="130.0" y="703.8" text-anchor="middle" font-size="15" fill="#1d2433">(≤ 14F)</text>
<text x="130.0" y="723.2" text-anchor="middle" font-size="15" fill="#1d2433">+ antibiotics</text>
<rect x="270" y="614" width="220" height="130" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="645.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">pH 7.2–7.4</text>
<text x="380.0" y="664.8" text-anchor="middle" font-size="15" fill="#1d2433">Drain if LDH &gt; 900,</text>
<text x="380.0" y="684.2" text-anchor="middle" font-size="15" fill="#1d2433">glucose ≤ 72, septation,</text>
<text x="380.0" y="703.8" text-anchor="middle" font-size="15" fill="#1d2433">CT enhancement,</text>
<text x="380.0" y="723.2" text-anchor="middle" font-size="15" fill="#1d2433">ongoing fever</text>
<rect x="520" y="614" width="220" height="130" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="630.0" y="645.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">pH ≥ 7.4</text>
<text x="630.0" y="664.8" text-anchor="middle" font-size="15" fill="#1d2433">Antibiotics alone</text>
<text x="630.0" y="684.2" text-anchor="middle" font-size="15" fill="#1d2433">No immediate drain</text>
<text x="630.0" y="703.8" text-anchor="middle" font-size="15" fill="#1d2433">Re-tap if not</text>
<text x="630.0" y="723.2" text-anchor="middle" font-size="15" fill="#1d2433">improving</text>
<rect x="20" y="764" width="720" height="76" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="787.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Residual infected collection after drainage</text>
<text x="380.0" y="807.2" text-anchor="middle" font-size="15" fill="#1d2433">Intrapleural tPA 10 mg + DNase 5 mg twice daily × 3 days</text>
<text x="380.0" y="826.8" text-anchor="middle" font-size="15" fill="#1d2433">Failure or trapped lung → surgery (VATS debridement/decortication)</text>
<text x="380" y="864" text-anchor="middle" font-size="13" fill="#666">Glucose in mg/dL · LDH in IU/L · Adapted from BTS Guideline for pleural disease 2023 and Light's criteria</text>
</svg>

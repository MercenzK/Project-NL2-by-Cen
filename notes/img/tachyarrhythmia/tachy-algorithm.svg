<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 926" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="926" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Adult tachyarrhythmia with a pulse</text>
<rect x="110" y="48" width="540" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Tachyarrhythmia with a pulse (HR usually ≥ 150/min)</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">Airway, O2 if hypoxemic, monitor BP and SpO2</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">IV access · 12-lead ECG</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="150" y="156" width="460" height="96" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Unstable because of the tachycardia?</text>
<text x="380.0" y="199.5" text-anchor="middle" font-size="15" fill="#1d2433">Hypotension · acutely altered mental status</text>
<text x="380.0" y="219" text-anchor="middle" font-size="15" fill="#1d2433">Signs of shock · ischemic chest discomfort</text>
<text x="380.0" y="238.5" text-anchor="middle" font-size="15" fill="#1d2433">Acute heart failure</text>
<polyline points="150,204 120,204 120,264.6" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="120,264.6 120,288" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="610,204 660,204 660,264.6" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="660,264.6 660,288" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="120" y="196" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<text x="680" y="196" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="20" y="288" width="300" height="140" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="170.0" y="314.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Synchronized cardioversion</text>
<text x="170.0" y="334" text-anchor="middle" font-size="15" fill="#1d2433">Sedate whenever feasible</text>
<text x="170.0" y="353.5" text-anchor="middle" font-size="15" fill="#1d2433">Energy per device</text>
<text x="170.0" y="373" text-anchor="middle" font-size="15" fill="#1d2433">(max if unknown)</text>
<text x="170.0" y="392.5" text-anchor="middle" font-size="15" fill="#1d2433">Regular narrow: consider</text>
<text x="170.0" y="412" text-anchor="middle" font-size="15" fill="#1d2433">adenosine first</text>
<rect x="440" y="288" width="300" height="56" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="590.0" y="321.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">QRS ≥ 0.12 s?</text>
<polyline points="590,344 590,449" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="590,449 590,488" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="590,441.1 210,441.1" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="210,441.1 210,488" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<circle cx="590" cy="458" r="4" fill="#444"/>
<text x="300" y="437.6" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Narrow</text>
<text x="630" y="386" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Wide</text>
<rect x="20" y="488" width="380" height="170" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="210.0" y="529.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Narrow QRS</text>
<text x="210.0" y="549" text-anchor="middle" font-size="15" fill="#1d2433">Regular (SVT): vagal manoeuvre</text>
<text x="210.0" y="568.5" text-anchor="middle" font-size="15" fill="#1d2433">→ adenosine 6 mg → 12 mg rapid IV</text>
<text x="210.0" y="588" text-anchor="middle" font-size="15" fill="#1d2433">Irregular (AF/flutter): rate control</text>
<text x="210.0" y="607.5" text-anchor="middle" font-size="15" fill="#1d2433">β-blocker or diltiazem/verapamil</text>
<text x="210.0" y="627" text-anchor="middle" font-size="15" fill="#1d2433">(digoxin/amiodarone if HFrEF)</text>
<rect x="420" y="488" width="320" height="170" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="580.0" y="529.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Wide QRS</text>
<text x="580.0" y="549" text-anchor="middle" font-size="15" fill="#1d2433">Regular monomorphic:</text>
<text x="580.0" y="568.5" text-anchor="middle" font-size="15" fill="#1d2433">treat as VT → amiodarone</text>
<text x="580.0" y="588" text-anchor="middle" font-size="15" fill="#1d2433">150 mg IV over 10 min</text>
<text x="580.0" y="607.5" text-anchor="middle" font-size="15" fill="#1d2433">Adenosine only if regular</text>
<text x="580.0" y="627" text-anchor="middle" font-size="15" fill="#1d2433">and monomorphic</text>
<polyline points="210,658 210,675.5 580,675.5" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="580,658 580,675.5" fill="none" stroke="#444" stroke-width="2.2"/>
<circle cx="395" cy="686" r="4" fill="#444"/>
<polyline points="395,675.5 395,708" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="708" width="630" height="86" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="395.0" y="736.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">If refractory or deteriorates</text>
<text x="395.0" y="756.2" text-anchor="middle" font-size="15" fill="#1d2433">Look for cause · expert consultation</text>
<text x="395.0" y="775.8" text-anchor="middle" font-size="15" fill="#1d2433">Synchronized cardioversion · add antiarrhythmic</text>
<rect x="80" y="816" width="630" height="66" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="395.0" y="844.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Polymorphic VT with long QT (torsades de pointes)</text>
<text x="395.0" y="864" text-anchor="middle" font-size="15" fill="#1d2433">Magnesium sulfate IV · correct K+ · stop QT-prolonging drugs</text>
<text x="380" y="908" text-anchor="middle" font-size="13" fill="#666">Adapted from 2025 AHA Adult Tachyarrhythmia With a Pulse Algorithm and 2025 Thai AF guideline</text>
</svg>

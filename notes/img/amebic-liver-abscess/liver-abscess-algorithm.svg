<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="760" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Liver abscess: amebic vs pyogenic approach</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Fever + RUQ pain + tender hepatomegaly (Murphy sign negative)</text>
<text x="380.0" y="92" text-anchor="middle" font-size="13" fill="#1d2433">ALP ↑, leukocytosis → abdominal ultrasound first (CT if unclear)</text>
<polyline points="380,110 380,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="720" height="62" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="169.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Liver space-occupying lesion(s)</text>
<text x="380.0" y="186" text-anchor="middle" font-size="13" fill="#1d2433">CBC, LFT, blood culture × 2, amebic serology · stool microscopy has low yield</text>
<polyline points="380,204 380,210.1 195,210.1 195,215.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,215.2 195,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,210.1 565,210.1 565,215.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,215.2 565,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="236" width="350" height="94" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="195.0" y="262.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Favors amebic abscess</text>
<text x="195.0" y="279.1" text-anchor="middle" font-size="13" fill="#1d2433">Young man, endemic area / travel</text>
<text x="195.0" y="296" text-anchor="middle" font-size="13" fill="#1d2433">Solitary, right lobe, hypoechoic</text>
<text x="195.0" y="312.9" text-anchor="middle" font-size="13" fill="#1d2433">Amebic serology positive</text>
<rect x="390" y="236" width="350" height="94" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="565.0" y="262.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Favors pyogenic abscess</text>
<text x="565.0" y="279.1" text-anchor="middle" font-size="13" fill="#1d2433">Older age, diabetes, biliary disease</text>
<text x="565.0" y="296" text-anchor="middle" font-size="13" fill="#1d2433">Multiple lesions, bacteremia</text>
<text x="565.0" y="312.9" text-anchor="middle" font-size="13" fill="#1d2433">Klebsiella, E. coli, anaerobes</text>
<polyline points="195,330 195,362" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="565,330 565,362" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="362" width="350" height="110" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="195.0" y="387.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Medical therapy (no routine aspiration)</text>
<text x="195.0" y="404.6" text-anchor="middle" font-size="13" fill="#1d2433">Metronidazole 500–750 mg PO tid 7–10 days</text>
<text x="195.0" y="421.6" text-anchor="middle" font-size="13" fill="#1d2433">(or tinidazole 2 g daily × 3 days)</text>
<text x="195.0" y="438.4" text-anchor="middle" font-size="13" fill="#1d2433">→ then luminal agent: paromomycin</text>
<text x="195.0" y="455.4" text-anchor="middle" font-size="13" fill="#1d2433">(not simultaneously)</text>
<rect x="390" y="362" width="350" height="110" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="565.0" y="387.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Drainage + antibiotics</text>
<text x="565.0" y="404.6" text-anchor="middle" font-size="13" fill="#1d2433">&lt; 5 cm: needle aspiration · &gt; 5 cm: catheter</text>
<text x="565.0" y="421.6" text-anchor="middle" font-size="13" fill="#1d2433">IV cephalosporin + metronidazole</text>
<text x="565.0" y="438.4" text-anchor="middle" font-size="13" fill="#1d2433">(or BL/BLI, carbapenem) · total 2–6 weeks</text>
<text x="565.0" y="455.4" text-anchor="middle" font-size="13" fill="#1d2433">Culture the aspirate, then narrow</text>
<polyline points="195,472 195,504" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="565,472 565,504" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="504" width="350" height="110" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="529.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Aspirate / drain if</text>
<text x="195.0" y="546.6" text-anchor="middle" font-size="13" fill="#1d2433">No response in 5–7 days</text>
<text x="195.0" y="563.6" text-anchor="middle" font-size="13" fill="#1d2433">High rupture risk: &gt; 5 cm or left lobe</text>
<text x="195.0" y="580.5" text-anchor="middle" font-size="13" fill="#1d2433">Bacterial co-infection</text>
<text x="195.0" y="597.4" text-anchor="middle" font-size="13" fill="#1d2433">Uncertain diagnosis</text>
<rect x="390" y="504" width="350" height="110" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="565.0" y="529.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Surgery if</text>
<text x="565.0" y="546.6" text-anchor="middle" font-size="13" fill="#1d2433">Rupture / peritonitis</text>
<text x="565.0" y="563.6" text-anchor="middle" font-size="13" fill="#1d2433">Multiple large or thick-walled abscesses</text>
<text x="565.0" y="580.5" text-anchor="middle" font-size="13" fill="#1d2433">Failed percutaneous drainage</text>
<text x="565.0" y="597.4" text-anchor="middle" font-size="13" fill="#1d2433">Biliary source → treat (e.g. ERCP)</text>
<polyline points="195,614 195,646" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="565,614 565,646" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="646" width="720" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="673.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Rupture into peritoneum or pericardium = emergency</text>
<text x="380.0" y="690" text-anchor="middle" font-size="13" fill="#1d2433">Unclear type or unstable → empirical cover for both (cephalosporin + metronidazole)</text>
<text x="380" y="732" text-anchor="middle" font-size="12" fill="#666">RUQ = right upper quadrant · ALP = alkaline phosphatase · BL/BLI = beta-lactam / beta-lactamase inhibitor</text>
<text x="380" y="750" text-anchor="middle" font-size="12" fill="#666">Adapted from StatPearls: Amebic Liver Abscess (2025) and Liver Abscess (2023)</text>
</svg>

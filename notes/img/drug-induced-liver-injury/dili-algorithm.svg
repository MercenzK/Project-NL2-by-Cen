<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="800" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Drug-induced liver injury: approach</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Abnormal liver tests after a new drug, herb or supplement</text>
<text x="380.0" y="92" text-anchor="middle" font-size="13" fill="#1d2433">Take a full drug history (onset usually days to months after starting)</text>
<polyline points="380,110 380,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="720" height="62" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="177.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Calculate R = (ALT ÷ ULN) ÷ (ALP ÷ ULN) using the first abnormal values</text>
<polyline points="380,204 380,210.1 135,210.1 135,215.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,215.2 135,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,204 380,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,210.1 625,210.1 625,215.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,215.2 625,236" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="236" width="230" height="78" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="135.0" y="262.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">R &gt; 5</text>
<text x="135.0" y="279.6" text-anchor="middle" font-size="13" fill="#1d2433">Hepatocellular</text>
<text x="135.0" y="296.5" text-anchor="middle" font-size="13" fill="#1d2433">(e.g. isoniazid, NSAIDs)</text>
<rect x="265" y="236" width="230" height="78" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="271.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">R 2–5</text>
<text x="380.0" y="288" text-anchor="middle" font-size="13" fill="#1d2433">Mixed</text>
<rect x="510" y="236" width="230" height="78" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="625.0" y="262.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">R &lt; 2</text>
<text x="625.0" y="279.6" text-anchor="middle" font-size="13" fill="#1d2433">Cholestatic</text>
<text x="625.0" y="296.5" text-anchor="middle" font-size="13" fill="#1d2433">(e.g. amoxicillin-clavulanate)</text>
<polyline points="135,314 135,346" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,314 380,346" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="625,314 625,346" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="346" width="720" height="78" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="372.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Exclude other causes (DILI is a diagnosis of exclusion)</text>
<text x="380.0" y="389.6" text-anchor="middle" font-size="13" fill="#1d2433">Viral hepatitis A–E serology, autoantibodies, alcohol, ischemia</text>
<text x="380.0" y="406.5" text-anchor="middle" font-size="13" fill="#1d2433">Ultrasound (biliary obstruction) — especially if cholestatic · RUCAM for causality</text>
<polyline points="380,424 380,456" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="456" width="720" height="62" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="483.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Stop the suspected drug — the key treatment</text>
<text x="380.0" y="500" text-anchor="middle" font-size="13" fill="#1d2433">NAC for paracetamol · L-carnitine for valproate · steroids only if autoimmune features</text>
<polyline points="380,518 380,550" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="550" width="720" height="78" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="576.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Hepatocellular injury + jaundice (Hy’s law pattern) or INR rise / encephalopathy</text>
<text x="380.0" y="593.5" text-anchor="middle" font-size="13" fill="#1d2433">→ admit, monitor for acute liver failure</text>
<text x="380.0" y="610.4" text-anchor="middle" font-size="13" fill="#1d2433">→ refer to a transplant center early</text>
<rect x="20" y="654" width="720" height="94" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="680.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Anti-tuberculosis drugs (ATS statement)</text>
<text x="380.0" y="697.1" text-anchor="middle" font-size="13" fill="#1d2433">Stop isoniazid, rifampicin and pyrazinamide if ALT &gt; 3 × ULN with symptoms or jaundice,</text>
<text x="380.0" y="714" text-anchor="middle" font-size="13" fill="#1d2433">or ALT &gt; 5 × ULN without symptoms</text>
<text x="380.0" y="730.9" text-anchor="middle" font-size="13" fill="#1d2433">→ use a modified or alternative regimen (reintroduce drugs one at a time when ALT &lt; 2 × ULN)</text>
<text x="380" y="772" text-anchor="middle" font-size="12" fill="#666">ULN = upper limit of normal · RUCAM = Roussel Uclaf Causality Assessment Method · NAC = N-acetylcysteine</text>
<text x="380" y="790" text-anchor="middle" font-size="12" fill="#666">Adapted from LiverTox (RUCAM), StatPearls Drug-Induced Hepatotoxicity (2024) and ATS statement (2006)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="690" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Type 2 diabetes: diagnosis and drug choice</text>
<rect x="20" y="48" width="720" height="80" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Diagnosis (non-pregnant): A1C ≥ 6.5% · FPG ≥ 126 · 2-h PG ≥ 200 on 75-g OGTT · random PG ≥ 200 + symptoms</text>
<text x="380.0" y="92.6" text-anchor="middle" font-size="13" fill="#1d2433">No unequivocal hyperglycemia → need 2 abnormal results (same sample or repeated test)</text>
<text x="380.0" y="109.5" text-anchor="middle" font-size="13" fill="#1d2433">Prediabetes: A1C 5.7–6.4% · FPG 100–125 · 2-h PG 140–199 mg/dL</text>
<polyline points="380,128 380,160" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="160" width="720" height="46" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="187.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Symptomatic hyperglycemia, A1C &gt; 10% or glucose ≥ 300 mg/dL?</text>
<polyline points="380,206 380,214 195,214" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,214 195,238" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,214 565,214" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,214 565,238" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="238" width="350" height="80" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="195.0" y="265.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Yes → start insulin (± other agents)</text>
<text x="195.0" y="282.6" text-anchor="middle" font-size="13" fill="#1d2433">Check ketones and exclude DKA / HHS</text>
<text x="195.0" y="299.5" text-anchor="middle" font-size="13" fill="#1d2433">Youth with A1C ≥ 8.5%: basal insulin + metformin</text>
<rect x="390" y="238" width="350" height="80" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="565.0" y="265.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">No → lifestyle + glucose-lowering drug</text>
<text x="565.0" y="282.6" text-anchor="middle" font-size="13" fill="#1d2433">Choose by comorbidity, weight, hypoglycemia</text>
<text x="565.0" y="299.5" text-anchor="middle" font-size="13" fill="#1d2433">risk and cost (shared decision)</text>
<polyline points="565,318 565,350" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="350" width="720" height="46" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="377.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Compelling comorbidity? (drug chosen irrespective of A1C)</text>
<polyline points="380,396 380,404" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="102,404 658,404" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="102,404 102,428" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="288,404 288,428" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="472,404 472,428" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="658,404 658,428" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="428" width="165" height="112" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="102.5" y="454.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">ASCVD / high risk</text>
<text x="102.5" y="471.7" text-anchor="middle" font-size="12" fill="#1d2433">GLP-1 RA and/or</text>
<text x="102.5" y="488.6" text-anchor="middle" font-size="12" fill="#1d2433">SGLT2 inhibitor</text>
<text x="102.5" y="505.5" text-anchor="middle" font-size="12" fill="#1d2433">with proven</text>
<text x="102.5" y="522.4" text-anchor="middle" font-size="12" fill="#1d2433">CV benefit</text>
<rect x="205" y="428" width="165" height="112" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="287.5" y="454.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">Heart failure</text>
<text x="287.5" y="471.7" text-anchor="middle" font-size="12" fill="#1d2433">SGLT2 inhibitor</text>
<text x="287.5" y="488.6" text-anchor="middle" font-size="12" fill="#1d2433">Avoid pioglitazone</text>
<text x="287.5" y="505.5" text-anchor="middle" font-size="12" fill="#1d2433">(fluid retention,</text>
<text x="287.5" y="522.4" text-anchor="middle" font-size="12" fill="#1d2433">HF worsening)</text>
<rect x="390" y="428" width="165" height="112" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="472.5" y="454.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">CKD (eGFR 20–60</text>
<text x="472.5" y="471.7" text-anchor="middle" font-size="12" fill="#1d2433">or albuminuria)</text>
<text x="472.5" y="488.6" text-anchor="middle" font-size="12" fill="#1d2433">SGLT2i or GLP-1 RA</text>
<text x="472.5" y="505.5" text-anchor="middle" font-size="12" fill="#1d2433">+ ACEi / ARB</text>
<text x="472.5" y="522.4" text-anchor="middle" font-size="12" fill="#1d2433">eGFR &lt; 30: GLP-1 RA</text>
<rect x="575" y="428" width="165" height="112" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="657.5" y="446.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2433">None of these</text>
<text x="657.5" y="463.2" text-anchor="middle" font-size="12" fill="#1d2433">Metformin first</text>
<text x="657.5" y="480.2" text-anchor="middle" font-size="12" fill="#1d2433">(start if eGFR ≥ 45,</text>
<text x="657.5" y="497.1" text-anchor="middle" font-size="12" fill="#1d2433">stop if &lt; 30)</text>
<text x="657.5" y="514.0" text-anchor="middle" font-size="12" fill="#1d2433">Weight goal: GLP-1 RA</text>
<text x="657.5" y="530.9" text-anchor="middle" font-size="12" fill="#1d2433">or tirzepatide</text>
<polyline points="102,540 102,550" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="288,540 288,550" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="472,540 472,550" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="658,540 658,550" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="102,550 658,550" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,550 380,576" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="576" width="720" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="603.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Reassess every 3–6 months · intensify without delay</text>
<text x="380.0" y="620.0" text-anchor="middle" font-size="13" fill="#1d2433">Consider initial combination if A1C is 1.5–2% above goal · reduce sulfonylurea / insulin when adding new agents</text>
<text x="380" y="662" text-anchor="middle" font-size="12" fill="#666">FPG = fasting plasma glucose · PG = plasma glucose · ASCVD = atherosclerotic CV disease · GLP-1 RA = GLP-1 receptor agonist</text>
<text x="380" y="680" text-anchor="middle" font-size="12" fill="#666">Adapted from ADA Standards of Care in Diabetes 2026 (sections 2, 9 and 14)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="sans-serif">
<rect width="760" height="660" fill="#ffffff"/>
<text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Hemodynamic profiles in decompensated HF</text>
<text x="310" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f5f99">DRY</text>
<text x="310" y="92" text-anchor="middle" font-size="14" fill="#1d2433">no congestion</text>
<text x="570" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f5f99">WET</text>
<text x="570" y="92" text-anchor="middle" font-size="14" fill="#1d2433">congestion</text>
<text x="95" y="185" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">WARM</text>
<text x="95" y="205" text-anchor="middle" font-size="14" fill="#1d2433">adequate</text>
<text x="95" y="222" text-anchor="middle" font-size="14" fill="#1d2433">perfusion</text>
<text x="95" y="355" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f5f99">COLD</text>
<text x="95" y="375" text-anchor="middle" font-size="14" fill="#1d2433">hypo-</text>
<text x="95" y="392" text-anchor="middle" font-size="14" fill="#1d2433">perfusion</text>
<rect x="185" y="108" width="250" height="170" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="310.0" y="169.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Warm–Dry</text>
<text x="310.0" y="188.5" text-anchor="middle" font-size="15" fill="#1d2433">Compensated</text>
<text x="310.0" y="208.0" text-anchor="middle" font-size="15" fill="#1d2433">Optimize oral</text>
<text x="310.0" y="227.5" text-anchor="middle" font-size="15" fill="#1d2433">foundational therapy</text>
<rect x="445" y="108" width="250" height="170" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="570.0" y="159.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Warm–Wet</text>
<text x="570.0" y="178.8" text-anchor="middle" font-size="15" fill="#1d2433">(most common)</text>
<text x="570.0" y="198.2" text-anchor="middle" font-size="15" fill="#1d2433">IV loop diuretic</text>
<text x="570.0" y="217.8" text-anchor="middle" font-size="15" fill="#1d2433">+ vasodilator if</text>
<text x="570.0" y="237.2" text-anchor="middle" font-size="15" fill="#1d2433">SBP &gt; 110 mmHg</text>
<rect x="185" y="288" width="250" height="170" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="310.0" y="339.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Cold–Dry</text>
<text x="310.0" y="358.8" text-anchor="middle" font-size="15" fill="#1d2433">Low output, no congestion</text>
<text x="310.0" y="378.2" text-anchor="middle" font-size="15" fill="#1d2433">Check volume status;</text>
<text x="310.0" y="397.8" text-anchor="middle" font-size="15" fill="#1d2433">cautious fluid challenge</text>
<text x="310.0" y="417.2" text-anchor="middle" font-size="15" fill="#1d2433">± inotrope</text>
<rect x="445" y="288" width="250" height="170" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="570.0" y="339.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Cold–Wet</text>
<text x="570.0" y="358.8" text-anchor="middle" font-size="15" fill="#1d2433">Cardiogenic shock risk</text>
<text x="570.0" y="378.2" text-anchor="middle" font-size="15" fill="#1d2433">Inotrope (dobutamine)</text>
<text x="570.0" y="397.8" text-anchor="middle" font-size="15" fill="#1d2433">± vasopressor if SBP &lt; 90</text>
<text x="570.0" y="417.2" text-anchor="middle" font-size="15" fill="#1d2433">then diuretic; consider MCS</text>
<rect x="40" y="480" width="330" height="130" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="205.0" y="521.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Signs of congestion (wet)</text>
<text x="205.0" y="540.5" text-anchor="middle" font-size="15" fill="#1d2433">Orthopnea, PND, raised JVP,</text>
<text x="205.0" y="560.0" text-anchor="middle" font-size="15" fill="#1d2433">crepitations, S3, edema,</text>
<text x="205.0" y="579.5" text-anchor="middle" font-size="15" fill="#1d2433">hepatojugular reflux, ascites</text>
<rect x="390" y="480" width="330" height="130" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="555.0" y="521.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Signs of hypoperfusion (cold)</text>
<text x="555.0" y="540.5" text-anchor="middle" font-size="15" fill="#1d2433">Cold clammy extremities, narrow</text>
<text x="555.0" y="560.0" text-anchor="middle" font-size="15" fill="#1d2433">pulse pressure, oliguria,</text>
<text x="555.0" y="579.5" text-anchor="middle" font-size="15" fill="#1d2433">confusion, rising lactate</text>
<text x="380" y="642" text-anchor="middle" font-size="13" fill="#666">MCS = mechanical circulatory support · Adapted from HFCT 2019 and ESC heart failure guidelines</text>
</svg>

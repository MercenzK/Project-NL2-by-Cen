<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="790" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Suspected chronic coronary syndrome: 4 steps</text>
<rect x="120" y="48" width="520" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 1 · Clinical evaluation</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">Typical/atypical angina? Rule out ACS (ECG ± troponin)</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">and non-cardiac causes · basic labs</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="120" y="156" width="520" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="179.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 2 · Resting echocardiogram</text>
<text x="380.0" y="199.2" text-anchor="middle" font-size="15" fill="#1d2433">LV function, valve disease (e.g. aortic stenosis)</text>
<text x="380.0" y="218.8" text-anchor="middle" font-size="15" fill="#1d2433">Estimate clinical likelihood of obstructive CAD</text>
<polyline points="380,232 380,264" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="230" y="264" width="300" height="56" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="297.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Clinical likelihood?</text>
<polyline points="230,292 110,292 110,330.5" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,320 380,330.5" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="530,292 650,292 650,330.5" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="110,330.5 110,350" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,330.5 380,350" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="650,330.5 650,350" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="350" width="180" height="110" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="110.0" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Very low (≤ 5%)</text>
<text x="110.0" y="400.5" text-anchor="middle" font-size="15" fill="#1d2433">Defer testing</text>
<text x="110.0" y="420" text-anchor="middle" font-size="15" fill="#1d2433">Look for other</text>
<text x="110.0" y="439.5" text-anchor="middle" font-size="15" fill="#1d2433">causes</text>
<rect x="250" y="350" width="260" height="110" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Low – moderate / high</text>
<text x="380.0" y="400.5" text-anchor="middle" font-size="15" fill="#1d2433">Step 3 · Non-invasive test</text>
<text x="380.0" y="420" text-anchor="middle" font-size="15" fill="#1d2433">CCTA (rule out CAD) or</text>
<text x="380.0" y="439.5" text-anchor="middle" font-size="15" fill="#1d2433">functional imaging</text>
<rect x="560" y="350" width="180" height="110" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="650.0" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Very high / high risk</text>
<text x="650.0" y="400.5" text-anchor="middle" font-size="15" fill="#1d2433">or refractory angina</text>
<text x="650.0" y="420" text-anchor="middle" font-size="15" fill="#1d2433">→ invasive</text>
<text x="650.0" y="439.5" text-anchor="middle" font-size="15" fill="#1d2433">angiography</text>
<polyline points="110,460 110,483.1 380,483.1" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="650,460 650,483.1 380,483.1" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="380,460 380,483.1" fill="none" stroke="#444" stroke-width="2.2"/>
<circle cx="380" cy="500" r="4" fill="#444"/>
<polyline points="380,483.1 380,526" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="526" width="600" height="110" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="557" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 4 · Treatment for all with CCS</text>
<text x="380.0" y="576.5" text-anchor="middle" font-size="15" fill="#1d2433">Lifestyle · aspirin (or clopidogrel) · high-intensity statin</text>
<text x="380.0" y="596" text-anchor="middle" font-size="15" fill="#1d2433">Antianginal: SL nitrate PRN + beta-blocker or CCB first-line</text>
<text x="380.0" y="615.5" text-anchor="middle" font-size="15" fill="#1d2433">ACEI/ARB, SGLT2i/GLP-1 RA when indicated</text>
<polyline points="380,636 380,668" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="668" width="600" height="76" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="691.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Revascularization (PCI / CABG)</text>
<text x="380.0" y="711.2" text-anchor="middle" font-size="15" fill="#1d2433">Refractory angina despite medical therapy, or high-risk anatomy</text>
<text x="380.0" y="730.8" text-anchor="middle" font-size="15" fill="#1d2433">(left main, multivessel with low LVEF, diabetes → favour CABG)</text>
<text x="380" y="772" text-anchor="middle" font-size="13" fill="#666">CCTA = coronary CT angiography · Adapted from 2024 ESC CCS and 2023 AHA/ACC CCD guidelines</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 696" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="696" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Acute pancreatitis: diagnosis and early management</text>
<rect x="20" y="48" width="720" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="72.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Diagnosis: 2 of 3</text>
<text x="380.0" y="90.9" text-anchor="middle" font-size="14" fill="#1d2433">(1) typical epigastric pain radiating to back · (2) lipase/amylase &gt; 3 × ULN</text>
<text x="380.0" y="109.1" text-anchor="middle" font-size="14" fill="#1d2433">(3) characteristic imaging — CT not needed if (1) + (2) present</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="156" width="720" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="180.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Etiology: transabdominal ultrasound in every patient (gallstones)</text>
<text x="380.0" y="198.9" text-anchor="middle" font-size="14" fill="#1d2433">No gallstones or heavy alcohol → triglyceride (cause if &gt; 1,000 mg/dL), calcium</text>
<text x="380.0" y="217.1" text-anchor="middle" font-size="14" fill="#1d2433">Age &gt; 40 and no cause → consider pancreatic tumor</text>
<polyline points="380,232 380,264" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="264" width="720" height="76" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="288.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Risk assessment in the first 48 h</text>
<text x="380.0" y="306.9" text-anchor="middle" font-size="14" fill="#1d2433">Organ failure or SIRS → monitored bed / ICU</text>
<text x="380.0" y="325.1" text-anchor="middle" font-size="14" fill="#1d2433">Warning signs: rising BUN or hematocrit, SIRS, obesity, comorbidity</text>
<polyline points="380,340 380,372" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="372" width="720" height="96" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="397.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Initial management</text>
<text x="380.0" y="415.8" text-anchor="middle" font-size="14" fill="#1d2433">Moderately aggressive IV fluid: Lactated Ringer (bolus 10 mL/kg only if hypovolemic,</text>
<text x="380.0" y="434" text-anchor="middle" font-size="14" fill="#1d2433">then ~1.5 mL/kg/h) · reassess at 6 h and over 24–48 h (aim: falling BUN)</text>
<text x="380.0" y="452.2" text-anchor="middle" font-size="14" fill="#1d2433">Analgesia · no prophylactic antibiotics</text>
<polyline points="380,468 380,474 135,474 135,479.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="135,479.2 135,500" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,474 380,500" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,474 625,474 625,479.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="625,479.2 625,500" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="500" width="230" height="150" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="135.0" y="534.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Nutrition</text>
<text x="135.0" y="552.6" text-anchor="middle" font-size="14" fill="#1d2433">Mild: oral low-fat</text>
<text x="135.0" y="570.8" text-anchor="middle" font-size="14" fill="#1d2433">solid diet within</text>
<text x="135.0" y="589" text-anchor="middle" font-size="14" fill="#1d2433">24–48 h as tolerated</text>
<text x="135.0" y="607.2" text-anchor="middle" font-size="14" fill="#1d2433">Severe: enteral (NG)</text>
<text x="135.0" y="625.4" text-anchor="middle" font-size="14" fill="#1d2433">&gt; parenteral</text>
<rect x="265" y="500" width="230" height="150" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="525.3" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">Biliary AP</text>
<text x="380.0" y="543.5" text-anchor="middle" font-size="14" fill="#1d2433">Cholangitis → ERCP</text>
<text x="380.0" y="561.7" text-anchor="middle" font-size="14" fill="#1d2433">within 24 h</text>
<text x="380.0" y="579.9" text-anchor="middle" font-size="14" fill="#1d2433">No cholangitis → no</text>
<text x="380.0" y="598.1" text-anchor="middle" font-size="14" fill="#1d2433">early ERCP</text>
<text x="380.0" y="616.3" text-anchor="middle" font-size="14" fill="#1d2433">Mild: cholecystectomy</text>
<text x="380.0" y="634.5" text-anchor="middle" font-size="14" fill="#1d2433">before discharge</text>
<rect x="510" y="500" width="230" height="150" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="625.0" y="525.3" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">No improvement</text>
<text x="625.0" y="543.5" text-anchor="middle" font-size="14" fill="#1d2433">after 48–72 h</text>
<text x="625.0" y="561.7" text-anchor="middle" font-size="14" fill="#1d2433">→ contrast CT / MRI</text>
<text x="625.0" y="579.9" text-anchor="middle" font-size="14" fill="#1d2433">(necrosis, collections)</text>
<text x="625.0" y="598.1" text-anchor="middle" font-size="14" fill="#1d2433">Infected necrosis:</text>
<text x="625.0" y="616.3" text-anchor="middle" font-size="14" fill="#1d2433">antibiotics, delay</text>
<text x="625.0" y="634.5" text-anchor="middle" font-size="14" fill="#1d2433">drainage ≥ 4 weeks</text>
<text x="380" y="668" text-anchor="middle" font-size="12" fill="#666">SIRS = systemic inflammatory response syndrome · ULN = upper limit of normal · NG = nasogastric</text>
<text x="380" y="686" text-anchor="middle" font-size="12" fill="#666">Adapted from American College of Gastroenterology guidelines: management of acute pancreatitis (2024)</text>
</svg>

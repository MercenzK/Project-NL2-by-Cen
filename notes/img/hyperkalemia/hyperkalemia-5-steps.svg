<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 932" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="932" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Acute hyperkalaemia in adults: 5 steps</text>
<rect x="110" y="48" width="540" height="76" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="71.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Serum K+ ≥ 6.0 mmol/L (or suspected)</text>
<text x="380.0" y="91.2" text-anchor="middle" font-size="15" fill="#1d2433">Urgent 12-lead ECG · cardiac monitoring · IV access</text>
<text x="380.0" y="110.8" text-anchor="middle" font-size="15" fill="#1d2433">Blood gas K+ while waiting · look for the cause</text>
<polyline points="380,124 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="230" y="156" width="300" height="52" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="187.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">ECG changes?</text>
<polyline points="230,182 130,182 130,218.5" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="530,182 630,182 630,218.5" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="130,218.5 130,238" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="630,218.5 630,238" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="180" y="174" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<text x="580" y="174" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="20" y="238" width="340" height="130" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="190.0" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 1 · Protect the heart</text>
<text x="190.0" y="298.5" text-anchor="middle" font-size="15" fill="#1d2433">10% calcium gluconate 30 mL IV</text>
<text x="190.0" y="318" text-anchor="middle" font-size="15" fill="#1d2433">over 10 min (CaCl2 10 mL in arrest)</text>
<text x="190.0" y="337.5" text-anchor="middle" font-size="15" fill="#1d2433">Repeat if ECG not improved</text>
<rect x="420" y="238" width="320" height="130" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="580.0" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">No calcium needed</text>
<text x="580.0" y="298.5" text-anchor="middle" font-size="15" fill="#1d2433">K+ ≥ 6.5 → treat urgently</text>
<text x="580.0" y="318" text-anchor="middle" font-size="15" fill="#1d2433">K+ 6.0–6.4 → treat,</text>
<text x="580.0" y="337.5" text-anchor="middle" font-size="15" fill="#1d2433">confirm with repeat sample</text>
<polyline points="190,368 190,386.2 580,386.2" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="580,368 580,386.2" fill="none" stroke="#444" stroke-width="2.2"/>
<circle cx="380" cy="398" r="4" fill="#444"/>
<polyline points="380,386.2 380,420" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="420" width="600" height="110" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="451" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 2 · Shift K+ into cells</text>
<text x="380.0" y="470.5" text-anchor="middle" font-size="15" fill="#1d2433">Insulin 10 units + glucose 25 g IV</text>
<text x="380.0" y="490" text-anchor="middle" font-size="15" fill="#1d2433">+ nebulised salbutamol 10–20 mg (adjunct only)</text>
<text x="380.0" y="509.5" text-anchor="middle" font-size="15" fill="#1d2433">If BG &lt; 7 mmol/L: 10% glucose 50 mL/h for 5 h</text>
<polyline points="380,530 380,562" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="562" width="600" height="110" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="593" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 3 · Remove K+ from the body</text>
<text x="380.0" y="612.5" text-anchor="middle" font-size="15" fill="#1d2433">K+ binder: SZC 10 g tds or patiromer</text>
<text x="380.0" y="632" text-anchor="middle" font-size="15" fill="#1d2433">Stop K+-raising drugs · treat the cause</text>
<text x="380.0" y="651.5" text-anchor="middle" font-size="15" fill="#1d2433">Dialysis if refractory, oliguric AKI or ESKD</text>
<polyline points="380,672 380,704" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="704" width="600" height="86" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="732.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 4 · Monitor</text>
<text x="380.0" y="752.2" text-anchor="middle" font-size="15" fill="#1d2433">Serum K+ at 1, 2, 4, 6 and 24 h</text>
<text x="380.0" y="771.8" text-anchor="middle" font-size="15" fill="#1d2433">Blood glucose for 6 h after insulin</text>
<polyline points="380,790 380,822" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="80" y="822" width="600" height="66" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="850.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Step 5 · Prevent recurrence</text>
<text x="380.0" y="870" text-anchor="middle" font-size="15" fill="#1d2433">Review drugs, diet and follow-up plan</text>
<text x="380" y="914" text-anchor="middle" font-size="13" fill="#666">SZC = sodium zirconium cyclosilicate · BG = blood glucose · Adapted from UKKA 2023 hyperkalaemia guideline</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 924" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="924" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Suspected acute pulmonary embolism</text>
<rect x="210" y="48" width="340" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="74.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Suspected acute PE</text>
<text x="380.0" y="95" text-anchor="middle" font-size="16" fill="#1d2433">Dyspnea, pleuritic pain, syncope</text>
<polyline points="380,110 380,156" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="210" y="156" width="340" height="70" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="186.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Hemodynamically unstable?</text>
<text x="380.0" y="206" text-anchor="middle" font-size="15" fill="#1d2433">Cardiac arrest, shock, SBP &lt; 90 mmHg</text>
<polyline points="550,191 588,191" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="569" y="182" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="590" y="142" width="150" height="98" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="665.0" y="168.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">High-risk PE</text>
<text x="665.0" y="186.8" text-anchor="middle" font-size="14" fill="#1d2433">UFH bolus</text>
<text x="665.0" y="205" text-anchor="middle" font-size="14" fill="#1d2433">Bedside echo</text>
<text x="665.0" y="223.2" text-anchor="middle" font-size="14" fill="#1d2433">± CTPA</text>
<polyline points="380,226 380,272" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="402" y="253.7" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="170" y="272" width="420" height="64" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="299.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Clinical probability</text>
<text x="380.0" y="319" text-anchor="middle" font-size="15" fill="#1d2433">Wells score or revised Geneva</text>
<polyline points="170,304 110,304 110,368" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="140" y="296" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Unlikely</text>
<rect x="20" y="368" width="180" height="70" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="110.0" y="388.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">D-dimer</text>
<text x="110.0" y="408.2" text-anchor="middle" font-size="15" fill="#1d2433">(age-adjusted</text>
<text x="110.0" y="427.8" text-anchor="middle" font-size="15" fill="#1d2433">if age &gt; 50)</text>
<polyline points="110,438 110,470" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="150" y="460" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Normal</text>
<rect x="20" y="470" width="180" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="110.0" y="496.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">PE excluded</text>
<text x="110.0" y="516" text-anchor="middle" font-size="15" fill="#1d2433">No anticoagulant</text>
<polyline points="200,403 300,403 300,432" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="250" y="395" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Raised</text>
<polyline points="590,304 650,304 650,368" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="620" y="296" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Likely</text>
<rect x="560" y="368" width="180" height="64" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="650.0" y="395.8" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">High probability</text>
<text x="650.0" y="414" text-anchor="middle" font-size="14" fill="#1d2433">go straight to CTPA</text>
<polyline points="650,432 650,460 460,460" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="300" y="432" width="160" height="56" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="465.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">CTPA</text>
<polyline points="380,488 380,564" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="412" y="528" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">PE +</text>
<rect x="130" y="564" width="500" height="86" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="592.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Risk stratification</text>
<text x="380.0" y="612.2" text-anchor="middle" font-size="15" fill="#1d2433">sPESI / PESI · RV on echo or CT · troponin, BNP</text>
<text x="380.0" y="631.8" text-anchor="middle" font-size="15" fill="#1d2433">ESC: low / intermediate-low / -high / high · AHA 2026: A–E</text>
<polyline points="380,650 380,682" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="90" y="682" width="580" height="86" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="710.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Anticoagulation for all (unless contraindicated)</text>
<text x="380.0" y="730.2" text-anchor="middle" font-size="15" fill="#1d2433">DOAC preferred over warfarin · LMWH preferred over UFH</text>
<text x="380.0" y="749.8" text-anchor="middle" font-size="15" fill="#1d2433">Low risk (sPESI 0, Hestia 0): consider early discharge</text>
<polyline points="380,768 380,800" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="90" y="800" width="580" height="76" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="823.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Deterioration / hemodynamic instability</text>
<text x="380.0" y="843.2" text-anchor="middle" font-size="15" fill="#1d2433">→ systemic thrombolysis · catheter-directed therapy or</text>
<text x="380.0" y="862.8" text-anchor="middle" font-size="15" fill="#1d2433">surgical embolectomy if lysis contraindicated or fails</text>
<text x="380" y="906" text-anchor="middle" font-size="13" fill="#666">CTPA = CT pulmonary angiography · Adapted from 2019 ESC PE Guidelines and 2026 AHA/ACC PE Guideline</text>
</svg>

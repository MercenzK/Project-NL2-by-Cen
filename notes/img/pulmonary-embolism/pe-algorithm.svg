<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="860" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Suspected acute pulmonary embolism</text>
<rect x="210" y="48" width="340" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="74.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">Suspected acute PE</text>
<text x="380.0" y="95.0" text-anchor="middle" font-size="16" fill="#1d2433">Dyspnea, pleuritic pain, syncope</text>
<polyline points="380,110 380,134" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="210" y="134" width="340" height="70" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="164.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Hemodynamically unstable?</text>
<text x="380.0" y="184.0" text-anchor="middle" font-size="15" fill="#1d2433">Cardiac arrest, shock, SBP &lt; 90 mmHg</text>
<polyline points="550,169 588,169" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="569" y="160" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Yes</text>
<rect x="590" y="120" width="150" height="98" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="665.0" y="146.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">High-risk PE</text>
<text x="665.0" y="164.8" text-anchor="middle" font-size="14" fill="#1d2433">UFH bolus</text>
<text x="665.0" y="183.0" text-anchor="middle" font-size="14" fill="#1d2433">Bedside echo</text>
<text x="665.0" y="201.2" text-anchor="middle" font-size="14" fill="#1d2433">± CTPA</text>
<polyline points="380,204 380,232" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="402" y="224" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">No</text>
<rect x="170" y="232" width="420" height="64" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="259.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Clinical probability</text>
<text x="380.0" y="279.0" text-anchor="middle" font-size="15" fill="#1d2433">Wells score or revised Geneva</text>
<polyline points="170,264 110,264 110,318" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="140" y="256" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Unlikely</text>
<rect x="20" y="318" width="180" height="70" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="110.0" y="338.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">D-dimer</text>
<text x="110.0" y="358.2" text-anchor="middle" font-size="15" fill="#1d2433">(age-adjusted</text>
<text x="110.0" y="377.8" text-anchor="middle" font-size="15" fill="#1d2433">if age &gt; 50)</text>
<polyline points="110,388 110,420" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="150" y="410" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Normal</text>
<rect x="20" y="420" width="180" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="110.0" y="446.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">PE excluded</text>
<text x="110.0" y="466.0" text-anchor="middle" font-size="15" fill="#1d2433">No anticoagulant</text>
<polyline points="200,353 300,353 300,382" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="250" y="345" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Raised</text>
<polyline points="590,264 650,264 650,318" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="620" y="256" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Likely</text>
<rect x="560" y="318" width="180" height="64" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="650.0" y="345.8" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2433">High probability</text>
<text x="650.0" y="364.0" text-anchor="middle" font-size="14" fill="#1d2433">go straight to CTPA</text>
<polyline points="650,382 650,410 460,410" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="300" y="382" width="160" height="56" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="415.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2433">CTPA</text>
<polyline points="380,438 380,508" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="412" y="478" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">PE +</text>
<rect x="130" y="508" width="500" height="86" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="380.0" y="536.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Risk stratification</text>
<text x="380.0" y="556.2" text-anchor="middle" font-size="15" fill="#1d2433">sPESI / PESI · RV on echo or CT · troponin, BNP</text>
<text x="380.0" y="575.8" text-anchor="middle" font-size="15" fill="#1d2433">ESC: low / intermediate-low / -high / high · AHA 2026: A–E</text>
<polyline points="380,594 380,622" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="90" y="622" width="580" height="86" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="380.0" y="650.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Anticoagulation for all (unless contraindicated)</text>
<text x="380.0" y="670.2" text-anchor="middle" font-size="15" fill="#1d2433">DOAC preferred over warfarin · LMWH preferred over UFH</text>
<text x="380.0" y="689.8" text-anchor="middle" font-size="15" fill="#1d2433">Low risk (sPESI 0, Hestia 0): consider early discharge</text>
<polyline points="380,708 380,736" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="90" y="736" width="580" height="76" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="759.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">Deterioration / hemodynamic instability</text>
<text x="380.0" y="779.2" text-anchor="middle" font-size="15" fill="#1d2433">→ systemic thrombolysis · catheter-directed therapy or</text>
<text x="380.0" y="798.8" text-anchor="middle" font-size="15" fill="#1d2433">surgical embolectomy if lysis contraindicated or fails</text>
<text x="380" y="842" text-anchor="middle" font-size="13" fill="#666">CTPA = CT pulmonary angiography · Adapted from 2019 ESC PE Guidelines and 2026 AHA/ACC PE Guideline</text>
</svg>

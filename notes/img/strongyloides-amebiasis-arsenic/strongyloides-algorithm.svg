<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="760" height="650" fill="#ffffff"/>
<text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Strongyloidiasis: screening and treatment</text>
<rect x="20" y="48" width="720" height="62" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="75.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Patient from endemic area (Southeast Asia, rural, barefoot / farming)</text>
<text x="380.0" y="92.0" text-anchor="middle" font-size="13" fill="#1d2433">± unexplained eosinophilia, larva currens, chronic GI or respiratory symptoms</text>
<polyline points="380,110 380,118 195,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="195,118 195,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="380,118 565,118" fill="none" stroke="#444" stroke-width="2.2"/>
<polyline points="565,118 565,142" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="142" width="350" height="110" rx="12" fill="#fff4e0" stroke="#d9820b" stroke-width="2.5"/>
<text x="195.0" y="167.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">About to start immunosuppression</text>
<text x="195.0" y="184.7" text-anchor="middle" font-size="13" fill="#1d2433">(corticosteroids, biologics,</text>
<text x="195.0" y="201.6" text-anchor="middle" font-size="13" fill="#1d2433">chemotherapy, transplant)</text>
<text x="195.0" y="218.4" text-anchor="middle" font-size="13" fill="#1d2433">or HTLV-1 infection</text>
<text x="195.0" y="235.4" text-anchor="middle" font-size="13" fill="#1d2433">→ screen: serology ± stool</text>
<rect x="390" y="142" width="350" height="110" rx="12" fill="#e6f5ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="565.0" y="167.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Uncomplicated strongyloidiasis</text>
<text x="565.0" y="184.7" text-anchor="middle" font-size="13" fill="#1d2433">(larvae in stool or positive serology)</text>
<text x="565.0" y="201.6" text-anchor="middle" font-size="13" fill="#1d2433">Treat even if asymptomatic</text>
<text x="565.0" y="218.4" text-anchor="middle" font-size="13" fill="#1d2433">Ivermectin 200 µg/kg/day × 2 days</text>
<text x="565.0" y="235.4" text-anchor="middle" font-size="13" fill="#1d2433">(albendazole = second line)</text>
<polyline points="195,252 195,284" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="284" width="720" height="94" rx="12" fill="#fde2e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="380.0" y="318.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Hyperinfection / disseminated disease (usually on steroids)</text>
<text x="380.0" y="335.6" text-anchor="middle" font-size="13" fill="#1d2433">Fever, septic shock, gram-negative bacteremia or meningitis, ARDS / alveolar hemorrhage,</text>
<text x="380.0" y="352.5" text-anchor="middle" font-size="13" fill="#1d2433">ileus, GI bleeding · larvae in sputum / BAL · eosinophilia often ABSENT</text>
<polyline points="380,378 380,410" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="410" width="720" height="94" rx="12" fill="#eaf2fb" stroke="#1f5f99" stroke-width="2.5"/>
<text x="380.0" y="436.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Management</text>
<text x="380.0" y="453.1" text-anchor="middle" font-size="13" fill="#1d2433">Ivermectin daily ≥ 2 weeks, until stool negative for 2 weeks</text>
<text x="380.0" y="470.0" text-anchor="middle" font-size="13" fill="#1d2433">+ broad-spectrum antibiotics for enteric gram-negative organisms</text>
<text x="380.0" y="486.9" text-anchor="middle" font-size="13" fill="#1d2433">+ reduce or stop immunosuppression when feasible</text>
<polyline points="380,504 380,536" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="20" y="536" width="720" height="62" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2.5"/>
<text x="380.0" y="563.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2433">Follow-up</text>
<text x="380.0" y="580.0" text-anchor="middle" font-size="13" fill="#1d2433">Serial stool and / or serology for 1–2 years to confirm eradication</text>
<text x="380" y="622" text-anchor="middle" font-size="12" fill="#666">HTLV-1 = human T-lymphotropic virus type 1 · BAL = bronchoalveolar lavage · screen for Loa loa before ivermectin in Loa-endemic Africa</text>
<text x="380" y="640" text-anchor="middle" font-size="12" fill="#666">Adapted from StatPearls: Strongyloidiasis (updated 2026)</text>
</svg>

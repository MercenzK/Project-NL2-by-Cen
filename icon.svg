<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ============================================================
       NL2 Med Quiz — ไอคอนแอป
       หัวใจ + เส้น ECG วาดขึ้นใหม่เป็นเวกเตอร์ (ไม่ได้ใช้ภาพสต็อก)
       จึงคมทุกขนาด ไม่มีลายน้ำ และไม่มีปัญหาลิขสิทธิ์

       ตั้งใจ "ไม่ใช้ clip-path" เพราะโปรแกรมแปลง SVG→PNG และตัวอ่าน
       favicon บางตัวไม่รองรับ แล้วเส้น ECG จะหายไปเงียบ ๆ
       แทนที่จะ clip ใช้วิธีวัดความกว้างของหัวใจที่ระดับ y=268 มาก่อน
       (ขอบซ้าย x=77 ขอบขวา x=435) แล้วลากเส้นให้พอดีขอบทั้งสองข้าง
       ============================================================ -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- หัวใจ กินราว 76% ของผืน เผื่อขอบให้ระบบปฏิบัติการครอบมุม -->
  <path d="M256 452 C 236 431, 41 287, 41 169 C 41 97, 97 51, 159 51 C 200 51, 236 72, 256 108 C 276 72, 312 51, 353 51 C 415 51, 471 97, 471 169 C 471 287, 276 431, 256 452 Z" fill="#e0202f"/>

  <!-- เส้น ECG: เส้นฐาน → QRS สูงชัน → T → เส้นฐาน -->
  <path d="M77 268 H152 L168 268 L190 148 L224 396 L250 222 L268 302 L284 268 H435" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
